<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thematics · Positions — design exploration</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/thematics-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="colors_and_type.css">
<!--
  Thematics — Positions
  ────────────────────────────────────────────────────────────
  Design exploration following the "thesis-position as a single
  surface" brief. Built on top of the existing Folio (v2) visual
  vocabulary: typeset broadsheet, hairlines, serif body, mono for
  identifiers and figures.

  The brief's hardest visual question is how the *expression block*
  sits inside *thesis prose*. Three takes are explored side-by-side
  under "The expression block." The rest of the surfaces commit to
  Take A — "the resolution" — as the recommended treatment.
-->
<style>
  html, body { margin: 0; background: #f0eee9; color: var(--foreground); }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; padding: 0; }
  a { color: inherit; text-decoration: none; }

  /* ──────────────────────────────────────────────────────────────
   * Shared "position" typesetting tokens & helpers.
   * The artboards re-use these — every position view shares the
   * same kicker / title / deck / body / margin grammar.
   * ──────────────────────────────────────────────────────────── */

  .pg {
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    padding: 0;
  }
  .pg-mast {
    border-bottom: 1px solid var(--foreground);
    background: var(--background);
  }
  .pg-mast-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px 56px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    font: 500 11px var(--font-mono);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }
  .pg-mast-name { justify-self: center; font: 600 22px/1 var(--font-serif); letter-spacing: -0.02em; color: var(--foreground); text-transform: none; }
  .pg-mast-right { justify-self: end; display: inline-flex; gap: 18px; align-items: center; }
  .pg-mast-right .lit { color: var(--foreground); }
  .pg-mast-rule { height: 1px; background: var(--border); }

  /* Layout: a 720 reading column with a 280 margin rail */
  .pg-layout {
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 56px 96px;
    display: grid;
    grid-template-columns: minmax(0, 720px) 64px minmax(220px, 280px);
    column-gap: 0;
    justify-content: center;
  }
  .pg-article { grid-column: 1 / 2; min-width: 0; }
  .pg-margin  { grid-column: 3 / 4; padding-top: 8px; }

  .pg-back {
    grid-column: 1 / -1;
    font: italic 500 13px var(--font-serif);
    color: var(--muted-foreground);
    margin-bottom: 28px;
    display: inline-flex; align-items: center; gap: 6px;
  }

  /* Header */
  .pg-head { padding-bottom: 22px; border-bottom: 1px solid var(--foreground); margin-bottom: 32px; }
  .pg-kicker {
    display: inline-flex; align-items: center; gap: 9px;
    font: 500 11px/1 var(--font-sans);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    margin-bottom: 18px;
  }
  .pg-kicker-dot { width: 7px; height: 7px; transform: rotate(45deg); }
  .pg-kicker .sep { color: var(--subtle-foreground); }
  .pg-title {
    font: 600 44px/1.04 var(--font-serif);
    letter-spacing: -0.022em;
    margin: 0 0 14px;
    text-wrap: balance;
    font-optical-sizing: auto;
  }
  .pg-deck {
    font: italic 400 21px/1.42 var(--font-serif);
    color: color-mix(in oklab, var(--foreground) 78%, transparent);
    margin: 0 0 20px;
    max-width: 56ch;
  }
  .pg-byline {
    font: 500 11px/1 var(--font-mono);
    letter-spacing: 0.08em;
    color: var(--muted-foreground);
    text-transform: uppercase;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .pg-byline em { font-style: italic; text-transform: none; letter-spacing: 0; font-family: var(--font-serif); font-size: 13px; color: var(--foreground); }
  .pg-byline .stamp {
    font: 500 10px/1 var(--font-mono);
    letter-spacing: 0.12em;
    border: 1px solid var(--foreground);
    padding: 4px 7px 3px;
    color: var(--foreground);
    border-radius: 0;
  }
  .pg-byline .stamp.muted { border-color: var(--border-strong); color: var(--muted-foreground); }
  .pg-byline .sep { color: var(--subtle-foreground); }

  /* Body */
  .pg-body { font: 400 19px/1.72 var(--font-serif); color: var(--foreground); font-optical-sizing: auto; }
  .pg-body p { margin: 0 0 18px; text-wrap: pretty; }
  .pg-body p.dc::first-letter {
    font: 600 64px/0.85 var(--font-serif);
    float: left;
    padding: 6px 10px 0 0;
    margin-top: 6px;
  }
  .pg-body em { font-style: italic; }
  .pg-body .crossref { color: var(--foreground); text-decoration: underline; text-decoration-color: color-mix(in oklab, var(--primary) 35%, transparent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .pg-body .sym { font: 500 0.95em var(--font-sans); letter-spacing: 0.01em; }

  /* ──────────────────────────────────────────────────────────
   * The expression block — three takes (and one common stamp).
   * The "set" stamp is the visible affordance of immutability:
   * a hairline rectangle in the brand mono, with the asterism
   * mark and a publication timecode. It reads like a printer's
   * imprint, not a versioned doc.
   * ──────────────────────────────────────────────────────── */

  /* Take A — "the resolution" (column-bleed, double rule) */
  .ex-a {
    margin: 32px -80px;
    padding: 24px 80px 22px;
    border-top: 3px double var(--foreground);
    border-bottom: 3px double var(--foreground);
    background: var(--background);
    font-family: var(--font-sans);
  }
  .ex-a .ex-flag {
    display: flex; align-items: baseline; justify-content: space-between; gap: 18px;
    margin-bottom: 16px;
  }
  .ex-a .ex-flag-name {
    font: 500 11px/1 var(--font-sans);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    display: inline-flex; align-items: center; gap: 10px;
  }
  .ex-a .ex-flag-name::before {
    content: '⁂';
    font: 400 14px var(--font-serif);
    color: var(--foreground);
    letter-spacing: 0;
    text-transform: none;
  }
  .ex-a .ex-flag-stamp {
    font: 500 10px/1 var(--font-mono);
    letter-spacing: 0.12em;
    color: var(--muted-foreground);
    text-transform: uppercase;
  }
  .ex-a .ex-headline {
    font: 600 22px/1.25 var(--font-serif);
    letter-spacing: -0.012em;
    margin: 4px 0 18px;
    text-wrap: balance;
  }
  .ex-a .ex-headline em { font-style: italic; color: color-mix(in oklab, var(--foreground) 70%, transparent); font-weight: 500; }

  .ex-a .ex-table {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr) 70px 70px 100px;
    row-gap: 0; column-gap: 14px;
    align-items: baseline;
    font: 400 14px/1.5 var(--font-sans);
  }
  .ex-a .ex-table > .ex-h {
    font: 500 10px/1 var(--font-mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    padding: 0 0 9px;
    border-bottom: 1px solid var(--border-strong);
  }
  .ex-a .ex-table > .ex-h.r { text-align: right; }
  .ex-a .ex-table > .ex-c { padding: 11px 0; border-bottom: 1px solid var(--border); }
  .ex-a .ex-table > .ex-c.r { text-align: right; font-variant-numeric: tabular-nums; font: 500 14px var(--font-mono); color: var(--foreground); }
  .ex-a .ex-table > .ex-c:last-child { border-bottom: 1px solid var(--border); }
  .ex-a .ex-side { font: 500 11px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; padding-top: 14px; }
  .ex-a .ex-side.l { color: var(--tag-emerald-ink); }
  .ex-a .ex-side.s { color: var(--tag-crimson-ink); }
  .ex-a .ex-sym { font: 500 14px var(--font-sans); }
  .ex-a .ex-name { font: italic 400 13px var(--font-serif); color: var(--muted-foreground); display: block; margin-top: 1px; }
  .ex-a .ex-foot {
    margin-top: 16px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 24px;
  }
  .ex-a .ex-summary {
    font: italic 400 14px/1.45 var(--font-serif);
    color: var(--muted-foreground);
    max-width: 52ch;
  }
  .ex-a .ex-cta {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 13px/1 var(--font-sans);
    color: var(--on-primary);
    background: var(--primary);
    padding: 11px 16px;
    border-radius: 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .ex-a .ex-cta:hover { background: var(--primary-hover); }
  .ex-a .ex-cta.secondary { background: transparent; color: var(--foreground); border: 1px solid var(--foreground); }
  .ex-a .ex-cta.secondary:hover { background: var(--surface-2); }
  .ex-a .ex-cta .arrow { font-family: var(--font-mono); }

  /* Take A — anonymous redaction */
  .ex-a.redacted .ex-table > .ex-c.redact {
    background: repeating-linear-gradient(
      135deg,
      var(--surface-2) 0 6px,
      var(--surface-3) 6px 12px
    );
    color: transparent;
    border-radius: 2px;
    padding: 11px 8px;
    user-select: none;
  }
  .ex-a.redacted .ex-table > .ex-c.redact .ex-name { background: transparent; color: transparent; }
  .ex-a .ex-paywall {
    display: grid; grid-template-columns: auto 1fr auto;
    gap: 16px; align-items: center;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    margin-top: 14px;
  }
  .ex-a .ex-paywall-lock {
    width: 28px; height: 28px; display: grid; place-items: center;
    border: 1px solid var(--border-strong);
    font: 500 12px var(--font-mono); color: var(--muted-foreground);
  }
  .ex-a .ex-paywall-msg {
    font: italic 400 14px/1.4 var(--font-serif);
    color: var(--foreground);
  }
  .ex-a .ex-paywall-msg em { color: var(--muted-foreground); font-style: italic; }

  /* Take A — track / returning state */
  .ex-a .ex-track-row {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr) 60px 70px 80px 80px;
    row-gap: 0; column-gap: 14px;
    align-items: baseline;
    font: 400 14px var(--font-sans);
  }
  .ex-a .ex-track-row > .ex-h {
    font: 500 10px/1 var(--font-mono);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    padding: 0 0 9px;
    border-bottom: 1px solid var(--border-strong);
  }
  .ex-a .ex-track-row > .ex-h.r { text-align: right; }
  .ex-a .ex-track-row > .ex-c { padding: 11px 0; border-bottom: 1px solid var(--border); }
  .ex-a .ex-track-row > .ex-c.r { text-align: right; font-variant-numeric: tabular-nums; font: 500 14px var(--font-mono); }
  .ex-a .pnl.up { color: var(--tag-emerald-ink); }
  .ex-a .pnl.down { color: var(--tag-crimson-ink); }
  .ex-a .ex-track-summary {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0;
    margin: 18px 0 8px;
    border-top: 1px solid var(--border);
  }
  .ex-a .ex-track-summary > div {
    padding: 14px 16px 12px;
    border-right: 1px solid var(--divider);
  }
  .ex-a .ex-track-summary > div:last-child { border-right: 0; }
  .ex-a .ex-track-summary .k {
    font: 500 10px/1 var(--font-mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    margin-bottom: 8px;
  }
  .ex-a .ex-track-summary .v {
    font: 500 28px/1 var(--font-serif);
    letter-spacing: -0.012em;
  }
  .ex-a .ex-track-summary .v.up { color: var(--tag-emerald-ink); }
  .ex-a .ex-track-summary .v.down { color: var(--tag-crimson-ink); }
  .ex-a .ex-track-summary .c {
    font: 400 12px var(--font-mono);
    color: var(--muted-foreground);
    margin-top: 4px;
  }
  .ex-a .ex-adjust-log {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font: italic 400 14px/1.55 var(--font-serif);
    color: var(--muted-foreground);
  }
  .ex-a .ex-adjust-log strong { font-style: normal; font-weight: 600; color: var(--foreground); }

  /* Take B — "the setting" (column-width, hairline rules) */
  .ex-b {
    margin: 28px 0;
    padding: 20px 0;
    border-top: 1px solid var(--foreground);
    border-bottom: 1px solid var(--foreground);
    font-family: var(--font-sans);
  }
  .ex-b .ex-flag {
    font: 500 11px/1 var(--font-sans);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .ex-b .ex-summary-line {
    font: 500 19px/1.42 var(--font-serif);
    color: var(--foreground);
    margin: 4px 0 14px;
  }
  .ex-b .ex-summary-line em { font-style: italic; color: var(--muted-foreground); font-weight: 400; }
  .ex-b .ex-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px 28px;
  }
  .ex-b .ex-item {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 6px 0;
    font: 400 14px var(--font-sans);
  }
  .ex-b .ex-item-name { display: flex; align-items: baseline; gap: 8px; }
  .ex-b .ex-item-side { font: 500 10px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }
  .ex-b .ex-item-side.l { color: var(--tag-emerald-ink); }
  .ex-b .ex-item-side.s { color: var(--tag-crimson-ink); }
  .ex-b .ex-item-sym { font: 500 13px var(--font-sans); }
  .ex-b .ex-item-w { font: 500 13px var(--font-mono); color: var(--muted-foreground); }
  .ex-b .ex-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .ex-b .ex-cta {
    font: italic 500 14px var(--font-serif);
    color: var(--primary);
    border-bottom: 1px solid color-mix(in oklab, var(--primary) 35%, transparent);
    padding-bottom: 1px;
  }
  .ex-b .ex-stamp {
    font: 500 10px var(--font-mono); letter-spacing: 0.12em; color: var(--muted-foreground); text-transform: uppercase;
  }

  /* Take C — "the inline ledger" (no chrome, prose-typography) */
  .ex-c {
    margin: 28px 0;
    font-family: var(--font-serif);
  }
  .ex-c .ex-c-flag {
    font: italic 400 15px/1 var(--font-serif);
    color: var(--muted-foreground);
    margin-bottom: 12px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--border);
  }
  .ex-c .ex-c-flag::before { content: '⁂  '; font-style: normal; color: var(--foreground); }
  .ex-c .ex-c-line {
    display: grid; grid-template-columns: 56px minmax(0, 1fr) 90px;
    gap: 14px;
    padding: 7px 0;
    border-bottom: 1px dotted var(--border);
    align-items: baseline;
    font: 400 17px/1.55 var(--font-serif);
  }
  .ex-c .ex-c-line:last-child { border-bottom: 0; }
  .ex-c .ex-c-side {
    font: italic 400 14px var(--font-serif);
    color: var(--muted-foreground);
  }
  .ex-c .ex-c-side em { font-style: normal; font-weight: 500; color: var(--foreground); }
  .ex-c .ex-c-name { display: inline; }
  .ex-c .ex-c-name .sym { font: 500 16px var(--font-sans); letter-spacing: 0.005em; }
  .ex-c .ex-c-name .nm { color: var(--muted-foreground); }
  .ex-c .ex-c-w { text-align: right; font: 500 16px var(--font-mono); }
  .ex-c .ex-c-foot {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-top: 14px;
    font: italic 400 14px/1.4 var(--font-serif);
    color: var(--muted-foreground);
  }
  .ex-c .ex-c-foot .ex-c-cta { color: var(--primary); cursor: pointer; }

  /* ──────────────────────────────────────────────────────────
   * Margin rail — used across the position reader.
   * ──────────────────────────────────────────────────────── */

  .pg-margin .mg-section { margin-bottom: 36px; }
  .pg-margin .mg-label {
    font: 500 10px/1 var(--font-mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .pg-margin .mg-contrib {
    display: grid; grid-template-columns: 36px 1fr; gap: 12px;
    align-items: center;
  }
  .pg-margin .mg-mono {
    width: 36px; height: 36px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border);
    font: 500 13px var(--font-serif); color: var(--foreground);
  }
  .pg-margin .mg-cn-name { font: 500 14px var(--font-sans); color: var(--foreground); }
  .pg-margin .mg-cn-handle { font: 400 12px var(--font-mono); color: var(--muted-foreground); }
  .pg-margin .mg-cn-stats {
    margin-top: 14px;
    font: italic 400 14px/1.5 var(--font-serif);
    color: var(--muted-foreground);
  }
  .pg-margin .mg-cn-stats em { font-style: normal; color: var(--foreground); font-weight: 500; }
  .pg-margin .mg-spark {
    display: flex; align-items: baseline; gap: 4px;
    margin-top: 14px; margin-bottom: 14px;
    height: 32px;
  }
  .pg-margin .mg-spark span {
    flex: 1; background: var(--ramp-violet-200);
  }
  .pg-margin .mg-cn-cta {
    margin-top: 10px;
    display: block; width: 100%;
    padding: 10px 12px;
    text-align: center;
    background: var(--primary); color: var(--on-primary);
    font: 500 13px var(--font-sans);
    cursor: pointer;
  }
  .pg-margin .mg-cn-cta:hover { background: var(--primary-hover); }
  .pg-margin .mg-cn-cta.secondary { background: transparent; color: var(--foreground); border: 1px solid var(--foreground); }
  .pg-margin .mg-cn-cta.secondary:hover { background: var(--surface-2); }

  .pg-margin .mg-rel {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .pg-margin .mg-rel:last-child { border-bottom: 0; }
  .pg-margin .mg-rel-title {
    font: 500 15px/1.35 var(--font-serif);
    color: var(--foreground);
    text-wrap: balance;
  }
  .pg-margin .mg-rel-meta {
    font: 400 11px var(--font-mono);
    color: var(--muted-foreground);
    margin-top: 6px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Sources footer */
  .pg-foot {
    margin-top: 56px;
    padding-top: 22px;
    border-top: 3px double var(--foreground);
  }
  .pg-foot-label {
    font: 500 11px/1 var(--font-sans);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted-foreground);
    margin-bottom: 18px;
  }
  .pg-foot-list { counter-reset: foot; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
  .pg-foot-item {
    counter-increment: foot;
    display: grid; grid-template-columns: 28px 1fr; gap: 8px;
    font: 400 14px/1.5 var(--font-serif);
    color: var(--foreground);
  }
  .pg-foot-item::before {
    content: counter(foot, decimal) '.';
    font: 500 12px var(--font-mono);
    color: var(--muted-foreground);
    padding-top: 3px;
  }
  .pg-foot-pub { font-weight: 600; }
  .pg-foot-title { font-style: italic; color: var(--muted-foreground); }
  .pg-foot-quote {
    display: block;
    margin-top: 4px;
    padding-left: 12px;
    border-left: 2px solid var(--primary);
    color: var(--foreground);
  }

  /* Successor / revision strip */
  .pg-revisions {
    margin: 36px 0 0;
    padding: 18px 20px;
    border: 1px solid var(--foreground);
    background: var(--surface);
    display: grid; grid-template-columns: auto 1fr auto; gap: 18px;
    align-items: center;
  }
  .pg-revisions-label {
    font: 500 10px/1 var(--font-mono);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted-foreground);
  }
  .pg-revisions-title {
    font: italic 500 17px/1.4 var(--font-serif);
    color: var(--foreground);
  }
  .pg-revisions-title em { color: var(--muted-foreground); font-weight: 400; }
  .pg-revisions-cta {
    font: 500 13px var(--font-sans);
    color: var(--primary);
    white-space: nowrap;
  }

  /* ──────────────────────────────────────────────────────────
   * Contributor page — variants share most chrome.
   * ──────────────────────────────────────────────────────── */
  .cn {
    background: var(--background);
    max-width: 1180px; margin: 0 auto;
    padding: 56px 56px 96px;
  }
  .cn-head {
    display: grid; grid-template-columns: 80px minmax(0, 1fr) auto;
    gap: 24px; align-items: end;
    padding-bottom: 22px; border-bottom: 1px solid var(--foreground);
    margin-bottom: 30px;
  }
  .cn-mono { width: 80px; height: 80px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--border-strong);
