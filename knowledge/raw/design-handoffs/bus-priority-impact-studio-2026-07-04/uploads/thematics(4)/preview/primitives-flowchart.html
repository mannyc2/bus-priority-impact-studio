<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--background)}
  .figure{max-width:680px}
  figcaption{font:italic 400 14px/1.5 var(--font-serif);color:var(--muted-foreground);margin-top:12px;max-width:560px}
  .t{font:400 14px var(--font-sans);fill:var(--foreground)}
  .ts{font:400 12px var(--font-sans);fill:var(--muted-foreground)}
  .th{font:500 14px var(--font-sans);fill:var(--foreground)}
  .box{fill:var(--surface);stroke:var(--border);stroke-width:1}
  .decision{fill:var(--ramp-amber-50);stroke:var(--ramp-amber-200);stroke-width:1}
  .start{fill:var(--ramp-violet-50);stroke:var(--ramp-violet-200);stroke-width:1}
  .arr{stroke:var(--foreground);stroke-width:1.5;fill:none;marker-end:url(#arrow)}
</style></head><body>
<figure class="figure" style="margin:0">
<svg width="100%" viewBox="0 0 680 320" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>How a new entry enters a theme — the editorial flow from draft to publication.</title>
  <desc>A flowchart with five steps: draft, review, decision (accept or revise), accept, publish. Arrows route in an L-shape; the decision node uses an amber soft tint to mark the branching point.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="start" x="40"  y="60" width="120" height="56" rx="12"/>
  <text class="th" x="100" y="84" text-anchor="middle">Draft</text>
  <text class="ts" x="100" y="102" text-anchor="middle">by a contributor</text>

  <rect class="box" x="200" y="60" width="120" height="56" rx="12"/>
  <text class="th" x="260" y="84" text-anchor="middle">Review</text>
  <text class="ts" x="260" y="102" text-anchor="middle">by two editors</text>

  <rect class="decision" x="360" y="60" width="140" height="56" rx="12"/>
  <text class="th" x="430" y="84" text-anchor="middle">Decision</text>
  <text class="ts" x="430" y="102" text-anchor="middle">accept or revise</text>

  <rect class="box" x="540" y="60" width="100" height="56" rx="12"/>
  <text class="th" x="590" y="84" text-anchor="middle">Accept</text>
  <text class="ts" x="590" y="102" text-anchor="middle">crossrefs added</text>

  <rect class="box" x="540" y="200" width="100" height="56" rx="12"/>
  <text class="th" x="590" y="224" text-anchor="middle">Publish</text>
  <text class="ts" x="590" y="242" text-anchor="middle">to the theme</text>

  <rect class="box" x="280" y="200" width="120" height="56" rx="12"/>
  <text class="th" x="340" y="224" text-anchor="middle">Revise</text>
  <text class="ts" x="340" y="242" text-anchor="middle">return to draft</text>

  <path class="arr" d="M160 88 H198"/>
  <path class="arr" d="M320 88 H358"/>
  <path class="arr" d="M500 88 H538"/>
  <path class="arr" d="M590 116 V198"/>

  <path class="arr" d="M430 116 V160 H340 V198"/>
  <text class="ts" x="445" y="155" text-anchor="start">revise</text>

  <path class="arr" d="M280 228 H100 V116"/>

  <text class="ts" x="520" y="80" text-anchor="end">accept</text>
</svg>
<figcaption>The editorial flow for a new entry. The amber decision node marks the branching point; the revise loop returns to draft along the bottom.</figcaption>
</figure>
</body></html>
