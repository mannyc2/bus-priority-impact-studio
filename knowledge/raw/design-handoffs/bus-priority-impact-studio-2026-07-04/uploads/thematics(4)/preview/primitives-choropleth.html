<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--background)}
  .figure{max-width:680px}
  .legend{display:flex;align-items:center;gap:10px;margin:0 0 14px;font:400 13px var(--font-sans);color:var(--muted-foreground)}
  .legend .scale{display:flex;height:10px;border-radius:2px;overflow:hidden;width:200px}
  .legend .scale span{flex:1}
  .legend .range{display:flex;justify-content:space-between;width:200px;font:400 12px var(--font-sans);color:var(--muted-foreground);margin-top:2px}
  .legend .label{font:400 13px var(--font-sans);color:var(--muted-foreground);margin-right:8px}
  figcaption{font:italic 400 14px/1.5 var(--font-serif);color:var(--muted-foreground);margin-top:14px;max-width:560px}
  svg.map{display:block;width:100%;height:auto;background:var(--background)}
</style></head><body>
<figure class="figure" style="margin:0">
  <div class="legend">
    <div>
      <div class="label">Crossrefs per million words, by US state</div>
      <div class="scale">
        <span style="background:#EEF5FB"></span>
        <span style="background:#C0DAEE"></span>
        <span style="background:#5391C6"></span>
        <span style="background:#2A6EA8"></span>
      </div>
      <div class="range"><span>0</span><span>20</span><span>40+</span></div>
    </div>
  </div>
  <svg id="map" class="map" role="img" aria-label="US choropleth showing crossreferences per million words, by state. Higher densities cluster in the Northeast and along the West Coast."></svg>
  <figcaption>Crossreference density across US states, in the <em>American architectural pedagogy</em> theme. Stroke between states is paper white so the divisions read without competing.</figcaption>
</figure>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
  const data = {
    "01": 8, "02": 4, "04": 14, "05": 6, "06": 38, "08": 18, "09": 28, "10": 18,
    "11": 24, "12": 16, "13": 12, "15": 12, "16": 10, "17": 26, "18": 14, "19": 12,
    "20": 8, "21": 9, "22": 6, "23": 18, "24": 27, "25": 41, "26": 17, "27": 14,
    "28": 6, "29": 12, "30": 8, "31": 7, "32": 9, "33": 22, "34": 31, "35": 12,
    "36": 38, "37": 14, "38": 4, "39": 16, "40": 8, "41": 26, "42": 27, "44": 24,
    "45": 10, "46": 5, "47": 11, "48": 17, "49": 11, "50": 23, "51": 21, "53": 31,
    "54": 8, "55": 14, "56": 6
  };

  const svg = d3.select('#map').attr('viewBox', '0 0 680 420');
  const path = d3.geoPath(d3.geoAlbersUsa().scale(820).translate([340, 210]));
  const color = d3.scaleQuantize().domain([0, 40]).range(['#EEF5FB','#C0DAEE','#5391C6','#2A6EA8']);

  d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then((us) => {
    const states = topojson.feature(us, us.objects.states).features;
    const mesh = topojson.mesh(us, us.objects.states, (a, b) => a !== b);

    svg.selectAll('path.state')
      .data(states).enter().append('path')
      .attr('class','state')
      .attr('d', path)
      .attr('fill', d => {
        const v = data[String(d.id).padStart(2,'0')];
        return v == null ? '#F4F4F2' : color(v);
      })
      .append('title')
      .text(d => {
        const v = data[String(d.id).padStart(2,'0')];
        return d.properties.name + (v != null ? ' — ' + v + ' per Mw' : ' — no data');
      });

    svg.append('path')
      .datum(mesh)
      .attr('d', path)
      .attr('fill','none')
      .attr('stroke','#FFFFFF')
      .attr('stroke-width',0.6);
  });
</script>
</body></html>
