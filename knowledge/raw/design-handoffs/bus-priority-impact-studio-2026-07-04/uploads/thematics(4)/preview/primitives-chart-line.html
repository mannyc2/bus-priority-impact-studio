<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--background)}
  .figure{max-width:680px}
  .legend{display:flex;flex-wrap:wrap;gap:18px;font:400 13px var(--font-sans);color:var(--muted-foreground);margin:0 0 14px}
  .legend span{display:inline-flex;align-items:center;gap:8px}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .legend b{color:var(--foreground);font-weight:500}
  figcaption{font:italic 400 14px/1.5 var(--font-serif);color:var(--muted-foreground);margin-top:14px;max-width:560px}
</style></head><body>
<figure class="figure" style="margin:0">
  <div class="legend">
    <span><i style="background:#6B4FB8"></i>Bauhaus, Weimar — <b>peak 142</b></span>
    <span><i style="background:#1F7A55"></i>Bauhaus, Dessau — <b>peak 200</b></span>
    <span><i style="background:#8C6E2D"></i>Bauhaus, Berlin — <b>peak 90</b></span>
  </div>
  <div style="position:relative;width:100%;height:280px">
    <canvas id="chart" role="img" aria-label="Line chart of Bauhaus student enrolment from 1919 to 1933, separated into three location eras: Weimar, Dessau, and Berlin.">
      Student enrolment grew from 35 in 1919 to a peak of about 200 in 1928 at Dessau, then declined to 90 in Berlin before the school's dissolution in 1933.
    </canvas>
  </div>
  <figcaption>Student enrolment, 1919 – 1933. Three eras, three hues from the ramp; dashed segments mark the relocation years when records overlap. Source: Wingler, <em>The Bauhaus</em>, MIT Press, 1969.</figcaption>
</figure>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  Chart.defaults.font.family = 'IBM Plex Sans, system-ui, sans-serif';
  Chart.defaults.font.size = 12;
  Chart.defaults.color = '#6B6B6F';
  Chart.defaults.borderColor = 'rgba(10,10,11,0.06)';

  const years = [1919,1920,1921,1922,1923,1924,1925,1926,1927,1928,1929,1930,1931,1932,1933];
  const weimar  = [35,90,100,120,140,130,null,null,null,null,null,null,null,null,null];
  const dessau  = [null,null,null,null,null,null,170,180,190,200,195,180,160,null,null];
  const berlin  = [null,null,null,null,null,null,null,null,null,null,null,null,null,90,0];

  new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels: years,
      datasets: [
        { label:'Weimar', data: weimar, borderColor:'#6B4FB8', backgroundColor:'#EEEAFA', borderWidth:1.6, pointRadius:3, pointBackgroundColor:'#6B4FB8', tension:0.25, spanGaps:false },
        { label:'Dessau', data: dessau, borderColor:'#1F7A55', backgroundColor:'#E6F4ED', borderWidth:1.6, pointRadius:3, pointStyle:'rect', pointBackgroundColor:'#1F7A55', tension:0.25 },
        { label:'Berlin', data: berlin, borderColor:'#8C6E2D', backgroundColor:'#FBF3E0', borderWidth:1.6, pointRadius:3, pointStyle:'triangle', pointBackgroundColor:'#8C6E2D', tension:0.25, borderDash:[4,3] },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor:'#0A0A0B', titleFont:{weight:'500'}, padding:8 } },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 0 } },
        y: { beginAtZero: true, grid: { color: 'rgba(10,10,11,0.06)' }, ticks: { stepSize: 50 } }
      }
    }
  });
</script>
</body></html>
