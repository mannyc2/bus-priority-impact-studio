<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--background)}
  .figure{max-width:680px}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .m{background:var(--surface);border-radius:var(--radius-xl);padding:16px 18px}
  .m .label{font:400 13px var(--font-sans);color:var(--muted-foreground);margin:0 0 6px}
  .m .value{font:500 28px/1.1 var(--font-serif);margin:0;letter-spacing:-0.01em;color:var(--foreground)}
  .m .delta{font:400 13px var(--font-sans);color:var(--muted-foreground);margin-top:4px;font-style:italic}
  figcaption{font:italic 400 14px/1.5 var(--font-serif);color:var(--muted-foreground);margin-top:12px;max-width:560px}
</style></head><body>
<figure class="figure" style="margin:0">
  <div class="metrics">
    <div class="m"><p class="label">Entries</p><p class="value">147</p><p class="delta">in this theme</p></div>
    <div class="m"><p class="label">Contributors</p><p class="value">8</p><p class="delta">over four years</p></div>
    <div class="m"><p class="label">Backlinks</p><p class="value">312</p><p class="delta">incoming</p></div>
    <div class="m"><p class="label">Median read</p><p class="value">7m</p><p class="delta">across the theme</p></div>
  </div>
  <figcaption>Summary of the <em>Architecture history</em> theme. Numbers are figures in serif, not chrome — they read as part of the entry.</figcaption>
</figure>
</body></html>
