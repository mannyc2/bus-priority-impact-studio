<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--background);font-family:var(--font-sans)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:var(--radius-pill);font:500 12px var(--font-sans);border:1px solid transparent}
  .dot{width:6px;height:6px;border-radius:50%}
  .note{font:500 12px var(--font-sans);color:var(--muted-foreground);margin-bottom:10px}
  .caption{font:400 13px var(--font-serif);font-style:italic;color:var(--muted-foreground);margin-top:8px}
</style></head><body>

<div class="note">Subject tags — theme color recipe</div>
<div class="row">
  <span class="chip" style="background:var(--tag-amber-soft);color:var(--tag-amber-ink)"><span class="dot" style="background:var(--tag-amber-ink)"></span>Typography</span>
  <span class="chip" style="background:var(--tag-emerald-soft);color:var(--tag-emerald-ink)"><span class="dot" style="background:var(--tag-emerald-ink)"></span>Botany</span>
  <span class="chip" style="background:var(--tag-crimson-soft);color:var(--tag-crimson-ink)"><span class="dot" style="background:var(--tag-crimson-ink)"></span>Cinema</span>
  <span class="chip" style="background:var(--tag-violet-soft);color:var(--tag-violet-ink)"><span class="dot" style="background:var(--tag-violet-ink)"></span>Philosophy</span>
  <span class="chip" style="background:var(--tag-ocean-soft);color:var(--tag-ocean-ink)"><span class="dot" style="background:var(--tag-ocean-ink)"></span>Cartography</span>
</div>

<div class="caption">Five subject hues. Pick by theme, not by hierarchy — they all read at the same weight.</div>

</body></html>
