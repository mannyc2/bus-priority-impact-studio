<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px;background:var(--background);display:grid;grid-template-columns:120px 1fr;gap:24px;align-items:start}
  .label{font:400 13px var(--font-sans);color:var(--muted-foreground);padding-top:6px}
  .prose{font:400 18px/1.6 var(--font-serif);color:var(--foreground);max-width:560px;font-optical-sizing:auto}
  .prose em{font-style:italic}
  .prose a{color:var(--foreground);text-decoration:underline;text-decoration-color:color-mix(in oklab,var(--primary) 35%,transparent);text-underline-offset:3px}
</style></head><body>
  <div class="label">Prose, 18/1.6</div>
  <div class="prose">
    A <em>theme</em> is not a folder. It is a chosen vantage from which a constellation of entries reads coherently — the way a <a href="#">curator</a> arranges objects so a room becomes argumentative. Thematics treats the cross-reference as a primary editorial gesture: the link is structure, not decoration.
  </div>
</body></html>
