<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--background);display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .group{display:flex;flex-direction:column;gap:10px}
  .ov{font:500 12px var(--font-sans);color:var(--muted-foreground)}
  .field label{font:500 12px var(--font-sans);color:var(--muted-foreground);display:block;margin-bottom:6px}
  .input{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--background);font:400 14px var(--font-sans);color:var(--foreground)}
  .input input, .input textarea{flex:1;border:0;outline:none;background:transparent;font:inherit;color:inherit;resize:none}
  .input.focus{border-color:var(--primary);box-shadow:var(--shadow-focus)}
  .input.invalid{border-color:oklch(0.55 0.20 25);box-shadow:0 0 0 3px oklch(0.55 0.20 25 / .25)}
  .textarea{align-items:flex-start;height:auto;padding:10px 12px;min-height:80px}
  .help{font:400 12px var(--font-sans);color:var(--muted-foreground);margin-top:6px}
  .error{font:500 12px var(--font-sans);color:oklch(0.55 0.20 25);margin-top:6px}
  .seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;background:var(--background);height:34px}
  .seg button{border:0;background:transparent;font:500 12px var(--font-sans);color:var(--muted-foreground);padding:0 14px;cursor:pointer;border-right:1px solid var(--border)}
  .seg button:last-child{border-right:0}
  .seg button.active{background:var(--foreground);color:var(--background)}
  .toggle{display:inline-flex;align-items:center;gap:10px;font:500 13px var(--font-sans)}
  .switch{width:36px;height:20px;background:var(--surface-3);border-radius:999px;position:relative;cursor:pointer;transition:background 140ms}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:var(--shadow-1);transition:transform 140ms}
  .switch.on{background:var(--primary)}
  .switch.on::after{transform:translateX(16px)}
</style></head><body>

<div class="group">
  <div class="ov">Inputs</div>
  <div class="field">
    <label>Entry title</label>
    <div class="input"><input value="The Bauhaus pedagogy"></div>
  </div>
  <div class="field">
    <label>Slug</label>
    <div class="input focus"><input value="/themes/architecture-history/bauhaus-pedagogy" style="font-family:var(--font-mono);font-size:13px"></div>
    <div class="help">URL-friendly. Lowercase, hyphens for spaces.</div>
  </div>
  <div class="field">
    <label>References</label>
    <div class="input invalid"><input value="not-a-doi"></div>
    <div class="error">Must be a DOI, ISBN, or full URL.</div>
  </div>
</div>

<div class="group">
  <div class="ov">Selects · toggles</div>
  <div class="field">
    <label>Reader pane</label>
    <div class="seg">
      <button class="active">Outline</button>
      <button>Backlinks</button>
      <button>References</button>
    </div>
  </div>
  <div class="field">
    <label>Display</label>
    <div class="toggle"><div class="switch on"></div> Show crossref previews on hover</div>
  </div>
  <div class="field">
    <label>Display</label>
    <div class="toggle"><div class="switch"></div> Number footnotes in superscript</div>
  </div>
  <div class="field">
    <label>Note</label>
    <div class="input textarea"><textarea rows="3" placeholder="Add a private note on this entry…"></textarea></div>
  </div>
</div>

</body></html>
