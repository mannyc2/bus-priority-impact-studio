<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--background)}
  .sw{height:120px;border-radius:var(--radius-xl);position:relative;overflow:hidden;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:14px;background:var(--background)}
  .swatch{width:32px;height:32px;border-radius:var(--radius);border:1px solid var(--border)}
  .l{font:600 13px var(--font-sans);color:var(--foreground)}
  .h{font:500 11px var(--font-mono);letter-spacing:.04em;color:var(--muted-foreground)}
  .d{font:500 12px var(--font-sans);color:var(--muted-foreground)}
</style></head><body>
<div class="sw">
  <div class="d">Foreground</div>
  <div class="swatch" style="background:var(--foreground)"></div>
  <div><div class="l">Ink — body</div><div class="h">#0A0A0B · 16:1 on paper</div></div>
</div>
<div class="sw">
  <div class="d">Muted</div>
  <div class="swatch" style="background:var(--muted-foreground)"></div>
  <div><div class="l">Metadata · caption</div><div class="h">#6B6B6F · 5.4:1</div></div>
</div>
<div class="sw">
  <div class="d">Subtle</div>
  <div class="swatch" style="background:var(--subtle-foreground)"></div>
  <div><div class="l">Tertiary · placeholder</div><div class="h">#9A9A9D · 3.0:1</div></div>
</div>
</body></html>
