<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sw{height:120px;border-radius:var(--radius-xl);position:relative;overflow:hidden;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:space-between;padding:14px}
  .l{font:600 13px var(--font-sans);color:var(--foreground)}
  .h{font:500 11px var(--font-mono);letter-spacing:.04em;color:var(--muted-foreground)}
  .d{font:500 12px var(--font-sans);color:var(--muted-foreground)}
</style></head><body>
<div class="sw" style="background:var(--background)">
  <div class="d">Background</div>
  <div><div class="l">Paper</div><div class="h">#FFFFFF</div></div>
</div>
<div class="sw" style="background:var(--surface)">
  <div class="d">Surface</div>
  <div><div class="l">Warm off-white</div><div class="h">#FAFAF9</div></div>
</div>
<div class="sw" style="background:var(--surface-2)">
  <div class="d">Surface · 2</div>
  <div><div class="l">Well / code</div><div class="h">#F4F4F2</div></div>
</div>
<div class="sw" style="background:var(--surface-3)">
  <div class="d">Surface · 3</div>
  <div><div class="l">Hover · divider</div><div class="h">#ECEBE7</div></div>
</div>
</body></html>
