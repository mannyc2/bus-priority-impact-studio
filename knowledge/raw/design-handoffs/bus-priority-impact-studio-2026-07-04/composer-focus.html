<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Composer · Focused explorations</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="system.jsx"></script>
<script type="text/babel">

const CW = 1320, CH = 880;

// ── Data ─────────────────────────────────────────────────────────────────────

const OUTLINE_CLAIMS = [
  { n: 1, title: 'M15 SBS is the slowest SBS route in Manhattan',        strength: 5, evidence: 3, caveats: 1 },
  { n: 2, title: 'A single corridor accounts for 43% of measured delay', strength: 4, evidence: 4, caveats: 2, editing: true },
  { n: 3, title: 'ACE rollout coincides with +0.7 mph PM-peak gain',     strength: 3, evidence: 3, caveats: 2 },
  { n: 4, title: 'Treatment gap on Madison Av',                          strength: 2, evidence: 1, caveats: 0, weak: true },
];

const ATTACHED = [
  { kind: 'metric', glyph: '#', name: '43% — Madison share of route delay',   src: 'computed · 18,420 / 42,890 RH per day · M1 pilot' },
  { kind: 'chart',  glyph: '▤', name: 'Rider-hours by segment, Mar 2026',      src: 'MTA Bus Speeds · weekday median, n = 2,003' },
  { kind: 'metric', glyph: '#', name: '18,420 rider-hours / day · Madison NB', src: 'M1 pilot · 168 ridership windows' },
  { kind: 'source', glyph: '¶', name: 'M15 SBS Wiki — Madison corridor',       src: 'Project wiki · Apr 28, 2026' },
];

// Extra items to trigger the fold problem in A2
const ATTACHED_LONG = [
  ...ATTACHED,
  { kind: 'metric', glyph: '#', name: '207,870 rider-trips/month · Madison',   src: 'MTA Ridership 2026' },
  { kind: 'metric', glyph: '#', name: '+0.7 mph PM-peak post-ACE · adj. segs', src: 'Bus Speeds · pre/post ACE activation' },
];

const SUGGESTED = [
  { kind: 'metric', glyph: '#', name: '207,870 rider-trips/month · Madison',  src: 'MTA Ridership 2026' },
  { kind: 'metric', glyph: '#', name: '4.2 mph weekday avg · Madison Av NB',  src: 'Bus Speeds · Mar 2026' },
];

const CATALOG_RESULTS = [
  { kind: 'chart',  glyph: '▤', name: 'Speed × hour · Madison 8 weeks',       src: 'Bus Speeds · heatmap' },
  { kind: 'metric', glyph: '#', name: '−68% violations Y/Y · ACE segments',   src: 'ACE program · Mar 2026' },
  { kind: 'source', glyph: '¶', name: 'DOT bus lane type classification',      src: 'NYC DOT GIS · Mar 2026' },
  { kind: 'metric', glyph: '#', name: '7.1 mph scheduled · Madison NB',        src: 'GTFS Mar 2026' },
];

// ── Shared primitives ─────────────────────────────────────────────────────────

function BriefBar() {
  return (
    <div style={{
      padding: '11px 28px', background: BPI.card,
      boxShadow: `inset 0 -1px 0 ${BPI.rule}`,
      display: 'flex', alignItems: 'center', gap: 14,
    }}>
      <RouteBadge route="M15" sbs size="md" />
      <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: '-0.01em' }}>The Madison corridor problem</div>
      <span className="chip accent">DRAFT v0.4</span>
      <span style={{ fontSize: 11, color: BPI.ink40, fontFamily: BPIMono }}>saved 12s ago</span>
      <div style={{ flex: 1 }} />
      <Button variant="primary" size="sm">Send for review →</Button>
    </div>
  );
}

function OutlineRow({ n, title, strength, editing, weak }) {
  const numColor = editing   ? BPI.accent
    : strength >= 4          ? BPI.good
    : strength >= 3          ? BPI.accent
    : weak || strength <= 2  ? BPI.warn
    : BPI.ink55;

  return (
    <div style={{
      padding: '9px 14px 9px 12px',
      borderLeft: editing ? `2px solid ${BPI.accent}` : '2px solid transparent',
      background: editing ? BPI.accentBg : 'transparent',
      borderRadius: '0 3px 3px 0',
      cursor: 'pointer',
      transition: 'background .1s',
    }}>
      <div style={{ display: 'flex', gap: 9, alignItems: 'flex-start' }}>
        <span style={{
          fontSize: 10, fontWeight: 700, fontFamily: BPIMono,
          color: numColor, flexShrink: 0, lineHeight: 1.7,
          letterSpacing: '0.04em',
        }}>0{n}</span>
        <span style={{
          fontSize: 12.5,
          fontWeight: editing ? 600 : 400,
          color: editing ? BPI.ink : BPI.ink70,
          lineHeight: 1.45, letterSpacing: '-0.005em',
        }}>{title}</span>
      </div>
    </div>
  );
}

function SlimOutline() {
  return (
    <div style={{
      background: BPI.paper, boxShadow: `inset -1px 0 0 ${BPI.rule}`,
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
    }}>
      <div style={{ padding: '16px 16px 12px', boxShadow: `inset 0 -1px 0 ${BPI.rule}` }}>
        <div className="eyebrow">Outline</div>
      </div>
      <div style={{ flex: 1, overflow: 'auto', padding: '8px 0' }}>
        {OUTLINE_CLAIMS.map(c => (
          <OutlineRow key={c.n} {...c} />
        ))}
        <div style={{ padding: '10px 14px' }}>
          <span style={{
            fontSize: 12, color: BPI.ink40,
            cursor: 'pointer', letterSpacing: '-0.005em',
          }}>+ Add claim</span>
        </div>
      </div>
    </div>
  );
}

function EGlyph({ glyph }) {
  return (
    <div style={{
      width: 24, height: 24, borderRadius: 3, flexShrink: 0,
      background: BPI.card, color: BPI.ink70,
      fontFamily: BPIMono, fontSize: 12, fontWeight: 700,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: `inset 0 0 0 1px ${BPI.rule}`,
    }}>{glyph}</div>
  );
}

function EvidenceRow({ e, attached }) {
  return (
    <div style={{
      padding: '9px 14px', borderRadius: 3, cursor: attached ? 'default' : 'pointer',
      background: attached ? BPI.accentBg : 'transparent',
      display: 'flex', alignItems: 'center', gap: 10,
      transition: 'background .1s',
    }}>
      <EGlyph glyph={e.glyph} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 12.5, fontWeight: attached ? 500 : 400, lineHeight: 1.3 }}>{e.name}</div>
        <div style={{ fontSize: 10, color: BPI.ink55, fontFamily: BPIMono, marginTop: 1 }}>{e.src}</div>
      </div>
      {attached
        ? <span style={{ fontSize: 10, fontWeight: 700, color: BPI.accent, fontFamily: BPIMono, flexShrink: 0 }}>✓ attached</span>
        : <span style={{ fontSize: 11, color: BPI.ink55, fontWeight: 500, flexShrink: 0, letterSpacing: '-0.01em' }}>+ attach</span>
      }
    </div>
  );
}

// ── Improved EvidenceInspector ────────────────────────────────────────────────
// What changes from the current design:
//   1. Search is pre-seeded from the active claim text — the analyst sees the
//      query and can modify it. Not a blank filter box.
//   2. ◆ "Suggested" tier appears above the fold, ranked by claim relevance.
//      AI attribution is the glyph, not a label or badge.
//   3. Results are mixed-type by default; tabs demote to type filters.
//   4. Each item has a "+ attach" affordance — no need to drag.

function ImprovedInspector() {
  const [activeTab, setActiveTab] = React.useState('All');
  const tabs = ['All', 'Metrics', 'Charts', 'Sources', 'Caveats'];

  return (
    <div style={{
      background: BPI.paper, boxShadow: `inset 1px 0 0 ${BPI.rule}`,
      display: 'flex', flexDirection: 'column', overflow: 'hidden',
    }}>
      {/* Header */}
      <div style={{ padding: '16px 18px 12px' }}>
        <div className="eyebrow" style={{ marginBottom: 10 }}>Evidence inspector</div>

        {/* Pre-seeded search — query is visible and editable */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 8,
          background: BPI.card, border: `1.5px solid ${BPI.accent}`,
          padding: '8px 12px', borderRadius: 3,
        }}>
          <svg width="13" height="13" viewBox="0 0 18 18" fill="none" stroke={BPI.accent} strokeWidth="1.8">
            <circle cx="8" cy="8" r="5.5" /><path d="M12.5 12.5L16 16" strokeLinecap="round" />
          </svg>
          <span style={{ flex: 1, fontSize: 12.5, color: BPI.ink, fontWeight: 400 }}>madison avenue rider-hours delay</span>
          <span style={{ fontSize: 10, color: BPI.ink40, fontFamily: BPIMono, flexShrink: 0 }}>claim 02</span>
        </div>

        {/* Type filters — tabs demoted, not primary nav */}
        <div style={{ display: 'flex', gap: 0, marginTop: 10, boxShadow: `inset 0 -1px 0 ${BPI.rule}` }}>
          {tabs.map((t) => (
            <span key={t} onClick={() => setActiveTab(t)} style={{
              padding: '7px 10px', fontSize: 12, cursor: 'pointer',
              color: t === activeTab ? BPI.ink : BPI.ink55,
              fontWeight: t === activeTab ? 600 : 400,
              boxShadow: t === activeTab ? `inset 0 -2px 0 ${BPI.ink}` : 'none',
              letterSpacing: t === 'All' ? 0 : '0.01em',
            }}>{t}</span>
          ))}
        </div>
      </div>

      {/* Results */}
      <div style={{ flex: 1, overflow: 'auto', padding: '4px 4px' }}>

        {/* ◆ Suggested tier */}
        <div style={{ padding: '6px 10px 4px' }}>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4,
            fontSize: 9.5, fontWeight: 700, color: BPI.ink55,
            fontFamily: BPIMono, letterSpacing: '0.07em',
          }}>
            <span style={{ color: BPI.accent }}>◆</span>
            SUGGESTED FOR THIS CLAIM
          </div>
          {SUGGESTED.map((e, i) => <EvidenceRow key={i} e={e} attached={false} />)}
        </div>

        <div style={{ height: 1, background: BPI.rule, margin: '8px 14px' }} />

        {/* Already attached — shown in context so analyst sees what's used */}
        <div style={{ padding: '4px 10px' }}>
          <div style={{
            fontSize: 9.5, fontWeight: 700, color: BPI.ink40,
            fontFamily: BPIMono, letterSpacing: '0.07em', marginBottom: 4, padding: '2px 4px',
          }}>ATTACHED TO THIS CLAIM</div>
          {ATTACHED.map((e, i) => <EvidenceRow key={i} e={e} attached={true} />)}
        </div>

        <div style={{ height: 1, background: BPI.rule, margin: '8px 14px' }} />

        {/* Other results */}
        <div style={{ padding: '4px 10px' }}>
          <div style={{
            fontSize: 9.5, fontWeight: 700, color: BPI.ink40,
            fontFamily: BPIMono, letterSpacing: '0.07em', marginBottom: 4, padding: '2px 4px',
          }}>OTHER RESULTS</div>
          {CATALOG_RESULTS.map((e, i) => <EvidenceRow key={i} e={e} attached={false} />)}
        </div>

      </div>

      {/* Footer hint */}
      <div style={{
        padding: '9px 18px', background: BPI.card, boxShadow: `inset 0 1px 0 ${BPI.rule}`,
        fontSize: 10.5, color: BPI.ink55, fontFamily: BPIMono,
        display: 'flex', alignItems: 'center', gap: 8,
      }}>
        <span style={{ color: BPI.ink40 }}>drag or click</span>
        <span>to attach evidence to this claim</span>
      </div>
    </div>
  );
}

// ── Standard claim editor body (shared between A1 and A2) ────────────────────

function ClaimBody({ evidence, showStrengthInline }) {
  return (
    <>
      {/* Claim header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
        <span className="eyebrow" style={{ color: BPI.accent }}>Claim 02 of 5</span>
        <span style={{ fontSize: 11, color: BPI.ink55, fontFamily: BPIMono }}>· seeded from Madison Av selection</span>
        <div style={{ flex: 1 }} />
        {showStrengthInline && (
          <>
            <StrengthBars strength={4} size="sm" />
            <span style={{ fontSize: 11, fontWeight: 600, color: BPI.good }}>4/5</span>
          </>
        )}
      </div>

      {/* Statement */}
      <div style={{ marginBottom: 24 }}>
        <div className="eyebrow" style={{ marginBottom: 8 }}>Statement</div>
        <div style={{
          padding: '16px 20px', background: BPI.paper, borderRadius: 4,
          fontSize: 17, fontWeight: 500, lineHeight: 1.6, letterSpacing: '-0.005em',
          boxShadow: `inset 0 0 0 1.5px ${BPI.ink}`, textWrap: 'pretty',
        }}>
          A 1.5-mile stretch of Madison Avenue (E&nbsp;28&nbsp;St → E&nbsp;58&nbsp;St, NB) accounts for{' '}
          <span style={{ background: BPI.accentBg, color: BPI.accent, padding: '1px 5px', borderRadius: 2, fontWeight: 600 }}>
            43%<Cite n={1} />
          </span>{' '}
          of the M15 SBS's total measured rider-hour delay<Cite n={2} />.
        </div>
        <div style={{ display: 'flex', gap: 12, fontSize: 11, color: BPI.ink55, marginTop: 7 }}>
          <span>42 words</span><span style={{ color: BPI.ink20 }}>·</span>
          <span>2 inline citations</span><span style={{ color: BPI.ink20 }}>·</span>
          <span style={{ color: BPI.good }}>✓ no normative language</span>
        </div>
      </div>

      {/* Evidence */}
      <div style={{ marginBottom: 20 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 10 }}>
          <div className="eyebrow">Evidence ({evidence.length})</div>
          <span style={{ fontSize: 11, color: BPI.ink55, fontFamily: BPIMono }}>drag to reorder · click × to remove</span>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
          {evidence.map((e, i) => (
            <div key={i} style={{
              padding: '11px 14px', background: BPI.paper, borderRadius: 3,
              boxShadow: `inset 0 0 0 1px ${BPI.rule}`,
              display: 'flex', alignItems: 'center', gap: 12,
            }}>
              <span style={{ cursor: 'grab', color: BPI.ink20, fontSize: 12, letterSpacing: '-0.1em', userSelect: 'none' }}>⋮⋮</span>
              <EGlyph glyph={e.glyph} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 500 }}>{e.name}</div>
                <div style={{ fontSize: 10.5, color: BPI.ink55, fontFamily: BPIMono, marginTop: 2 }}>{e.src}</div>
              </div>
              <span className="chip" style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.06em', flexShrink: 0 }}>{e.kind}</span>
              <button className="bpi" style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: BPI.ink40, fontSize: 15, padding: '2px 4px', lineHeight: 1, fontFamily: 'inherit' }}>×</button>
            </div>
          ))}
        </div>
      </div>

      {/* Caveats */}
      <div style={{ marginBottom: 20 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 10 }}>
          <div className="eyebrow">Caveats (2)</div>
          <button className="bpi" style={{ background: 'transparent', border: 'none', cursor: 'pointer', fontSize: 11, color: BPI.accent, fontWeight: 600, fontFamily: 'inherit' }}>+ from library →</button>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <Caveat tone="warn" title='"Speed" includes rider experience'>MTA segment speeds reflect dwell time, traffic, signals, and stops.</Caveat>
          <Caveat tone="warn" title="Single-month window">Numbers are from the March 2026 pilot. Multi-month baseline planned for v0.5.</Caveat>
        </div>
      </div>
    </>
  );
}

// ── A1 · Improved right rail ──────────────────────────────────────────────────

function A1() {
  return (
    <div className="bpi" style={{ width: CW, height: CH, display: 'flex', flexDirection: 'column' }}>
      <StudioBar active="Briefs" breadcrumb="Briefs / Madison corridor / draft v0.4" />
      <BriefBar />
      <div style={{ flex: 1, overflow: 'hidden', display: 'grid', gridTemplateColumns: '210px 1fr 360px' }}>
        <SlimOutline />

        {/* Standard claim editor */}
        <div style={{ overflow: 'auto', padding: '28px 36px', background: BPI.card, display: 'flex', flexDirection: 'column' }}>
          <ClaimBody evidence={ATTACHED} showStrengthInline={false} />

          {/* Strength — may scroll below fold with more evidence */}
          <div style={{
            padding: '14px 16px', background: BPI.goodBg, borderRadius: 3,
            display: 'flex', alignItems: 'center', gap: 14,
            boxShadow: `inset 0 0 0 1px oklch(0.85 0.05 155)`,
          }}>
            <StrengthBars strength={4} size="lg" />
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: BPI.good, marginBottom: 2 }}>Strength · 4 of 5 — defensible</div>
              <div style={{ fontSize: 11.5, color: BPI.ink70 }}>Add a multi-month baseline to reach 5/5.</div>
            </div>
            <Button variant="ghost" size="sm">How is this scored?</Button>
          </div>
        </div>

        <ImprovedInspector />
      </div>
    </div>
  );
}

// ── A2 · Fold fix — sticky strength bar ──────────────────────────────────────
// With 6 evidence items the strength block falls below the fold.
// A sticky footer on the editor column keeps it permanently visible.
// The analyst always knows the current strength regardless of scroll position.

function A2() {
  return (
    <div className="bpi" style={{ width: CW, height: CH, display: 'flex', flexDirection: 'column' }}>
      <StudioBar active="Briefs" breadcrumb="Briefs / Madison corridor / draft v0.4" />
      <BriefBar />
      <div style={{ flex: 1, overflow: 'hidden', display: 'grid', gridTemplateColumns: '210px 1fr 360px' }}>
        <SlimOutline />

        {/* Editor with sticky strength footer */}
        <div style={{ overflow: 'auto', background: BPI.card, display: 'flex', flexDirection: 'column' }}>
          <div style={{ flex: 1, padding: '28px 36px' }}>
            <ClaimBody evidence={ATTACHED_LONG} showStrengthInline={false} />

            {/* Caveats scroll below the fold with 6 items — strength visible via sticky */}
            <div style={{ height: 24 }} />
          </div>

          {/* Sticky footer — always at the bottom of the visible editor area */}
          <div style={{
            position: 'sticky', bottom: 0,
            padding: '11px 36px', background: BPI.goodBg,
            boxShadow: `inset 0 1px 0 oklch(0.82 0.06 155), 0 -4px 16px rgba(22,20,15,.06)`,
            display: 'flex', alignItems: 'center', gap: 14, flexShrink: 0,
          }}>
            <StrengthBars strength={4} size="lg" />
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, color: BPI.good, lineHeight: 1 }}>
                Strength · 4 of 5 — defensible
              </div>
              <div style={{ fontSize: 11, color: BPI.ink70, marginTop: 2 }}>
                Add a multi-month baseline to reach 5/5.
              </div>
            </div>
            <div style={{ flex: 1 }} />
            <div style={{ display: 'flex', gap: 8 }}>
              <Button variant="ghost" size="sm">How is this scored?</Button>
              <Button variant="secondary" size="sm">Send for review →</Button>
            </div>
          </div>
        </div>

        <ImprovedInspector />
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="focused"
        title="Composer · two focused problems"
        subtitle="Left: context-aware inspector — pre-seeded query, ◆ suggested tier, click-to-attach. Right: sticky strength bar — always visible as the evidence list grows.">

        <DCArtboard id="a1" label="Improved inspector — pre-seeded search · ◆ suggested · click-to-attach" width={CW} height={CH}>
          <A1 />
        </DCArtboard>

        <DCArtboard id="a2" label="Fold fix — sticky strength bar stays visible at any evidence count" width={CW} height={CH}>
          <A2 />
        </DCArtboard>

      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
