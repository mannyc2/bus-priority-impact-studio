<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Verdict Layer v2 — Bus Priority Impact Studio</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="system.jsx"></script>
<script type="text/babel" src="verdict-data.jsx"></script>
<script type="text/babel" src="verdict-primitives.jsx"></script>
<script type="text/babel" src="verdict-shell.jsx"></script>
<script type="text/babel" src="verdict-editorial.jsx"></script>

<script type="text/babel">
const R = window.VERDICT_ROUTES;

function App() {
  return (
    <DesignCanvas>

      <DCSection id="spread" title="Verdict Overview — F · The spread"
        subtitle="Three moments instead of five strips. A display-set verdict (two lines, the second carrying the judged tone) replaces the lede paragraph. Ranked findings LOOK ranked — the #1 finding is a wide feature card, 02/03 stack compactly beside it. The chart and the corridor map compose into one evidence figure — the when over the where, findings badged onto both (② in the trend, ① on the street). Map last, no metadata footer.">
        <DCArtboard id="f-m15" label="F · M15 worsening — display verdict → ranked-weight findings → composed evidence" width={1320} height={1690}><VerdictScreenF route={R.m15} /></DCArtboard>
        <DCArtboard id="f-s79" label="F posture · S79 healthy — good-news headline, checked-clean roster, green corridor" width={1320} height={1460}><VerdictScreenF route={R.s79} /></DCArtboard>
      </DCSection>

      <DCSection id="editorial" title="Previous round — for comparison"
        subtitle="E from the card-free round: equal-weight finding cards, story, corridor last.">
        <DCArtboard id="ed-e" label="E · Findings-led — finding cards → story → corridor last (① on the map); no verdict paragraph" width={1320} height={1560}><VerdictScreenE route={R.m15} /></DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
