<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>inspect</title>
<style>
  html, body { margin: 0; padding: 0; background: #d8d4cc; }
  .row { padding: 28px; display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
  .lab { font: 600 13px/1 monospace; color: #333; padding: 6px 0; width: 100%; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="system.jsx"></script>
<script type="text/babel" src="verdict-data.jsx"></script>
<script type="text/babel" src="verdict-primitives.jsx"></script>
<script type="text/babel" src="verdict-shell.jsx"></script>
<script type="text/babel" src="verdict-compositions.jsx"></script>
<script type="text/babel" src="verdict-mobile.jsx"></script>
<script type="text/babel">
const R = window.VERDICT_ROUTES;
function Lab({children}){return <div className="lab">{children}</div>;}
function App(){
  return (<div>
    <div className="row"><Lab>A · M15</Lab><VerdictScreenA route={R.m15} /></div>
    <div className="row"><Lab>B · M15</Lab><VerdictScreenB route={R.m15} /></div>
    <div className="row"><Lab>C · M15</Lab><VerdictScreenC route={R.m15} /></div>
    <div className="row"><Lab>A · B44 treated</Lab><VerdictScreenA route={R.b44} /></div>
    <div className="row"><Lab>A · S79 healthy</Lab><VerdictScreenA route={R.s79} /></div>
    <div className="row"><Lab>Mobile insights / masthead / healthy</Lab>
      <VerdictMobile route={R.m15} lead="insights" />
      <VerdictMobile route={R.m15} lead="masthead" />
      <VerdictMobile route={R.s79} lead="insights" />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
