    purpose: NOAA GHCN-Daily weather observations for NYC stations (Central Park, LaGuardia, JFK). Used as a confounder control when interpreting bus reliability dips (storm days, heavy snow, extreme heat).
    stations:
      - id: USW00094728
        name: NY CITY CENTRAL PARK
      - id: USW00014732
        name: NY LA GUARDIA AP
      - id: USW00094789
        name: JFK INTERNATIONAL
    status: active
    notes: |
      One CSV per station, ~17 MB for the full archive back to the station start
      date. No API key required. Ingest filters to a date window before upsert.
