[project]
name = "bp-corpus"
version = "0.0.1"
description = "Read-only Python accessors for the Bus Priority Studio corpus. Bind-mounted into the codemode findings-agent sandbox."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bp_corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
