name: Protected serving publication

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-reviewed-serving-candidate to authorize the reviewed operation
        required: true
        type: string
      release_tag:
        description: Immutable GitHub release tag containing the reviewed candidate
        required: true
        type: string
      candidate_asset:
        description: Exact candidate archive asset name
        required: true
        type: string
      candidate_asset_sha256:
        description: SHA-256 of the candidate archive
        required: true
        type: string
      preparation_asset:
        description: Exact canonical preparation receipt asset name
        required: true
        type: string
      preparation_sha256:
        description: SHA-256 of the canonical preparation receipt
        required: true
        type: string
      candidate_id:
        description: Reviewed candidate ID
        required: true
        type: string
      manifest_sha256:
        description: Reviewed candidate manifest SHA-256
        required: true
        type: string
      expected_release:
        description: Active release required by the activation CAS
        required: true
        type: string
      expected_candidate:
        description: Active candidate required by the activation CAS
        required: true
        type: string
      expected_generation:
        description: Active generation required by the activation CAS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: serving-production-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://bus-priority-impact-studio.c20carroll.workers.dev/
    env:
      CANDIDATE_ASSET: ${{ inputs.candidate_asset }}
      CANDIDATE_ASSET_SHA256: ${{ inputs.candidate_asset_sha256 }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      CANDIDATE_RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_CANDIDATE: ${{ inputs.expected_candidate }}
      EXPECTED_GENERATION: ${{ inputs.expected_generation }}
      EXPECTED_RELEASE: ${{ inputs.expected_release }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      PREPARATION_ASSET: ${{ inputs.preparation_asset }}
      PREPARATION_SHA256: ${{ inputs.preparation_sha256 }}
      CLOUDFLARE_ACCOUNT_ID: 7aa7065a7e971d97435b3f22098d78b0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PLAN098_ENDPOINT: https://bus-priority-plan098-operator.c20carroll.workers.dev/__operations/plan098
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Confirm reviewed production operation
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = publish-reviewed-serving-candidate
          test -n "$CLOUDFLARE_API_TOKEN"
          test "${#CANDIDATE_ID}" -eq 64
          test "${#MANIFEST_SHA256}" -eq 64
          test "${#CANDIDATE_ASSET_SHA256}" -eq 64
          test "${#PREPARATION_SHA256}" -eq 64
          [[ "$EXPECTED_GENERATION" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$CANDIDATE_ASSET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$PREPARATION_ASSET" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download and verify immutable approval packet
        id: candidate
        run: |
          set -euo pipefail
          output_dir=/tmp/serving-publication
          mkdir -p "$output_dir"
          gh release download "$CANDIDATE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CANDIDATE_ASSET" \
            --pattern "$PREPARATION_ASSET" \
            --dir "$output_dir"
          test "$(sha256sum "$output_dir/$CANDIDATE_ASSET" | cut -d' ' -f1)" = \
            "$CANDIDATE_ASSET_SHA256"
          test "$(sha256sum "$output_dir/$PREPARATION_ASSET" | cut -d' ' -f1)" = \
            "$PREPARATION_SHA256"
          candidate_root_name="$(jq -r '.candidate.rootDirectory' "$output_dir/$PREPARATION_ASSET")"
          [[ "$candidate_root_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          tar --zstd -xf "$output_dir/$CANDIDATE_ASSET" -C "$output_dir"
          candidate_root="$output_dir/$candidate_root_name"
          test -d "$candidate_root"
          test "$(sha256sum "$candidate_root/candidate.manifest.json" | cut -d' ' -f1)" = \
            "$MANIFEST_SHA256"
          test "$(jq -r '.candidateId' "$candidate_root/candidate.manifest.json")" = "$CANDIDATE_ID"
          test "$(jq -r '.candidate.candidateId' "$output_dir/$PREPARATION_ASSET")" = "$CANDIDATE_ID"
          test "$(jq -r '.candidate.manifestSha256' "$output_dir/$PREPARATION_ASSET")" = \
            "$MANIFEST_SHA256"
          test "$(jq -r '.candidate.archiveSha256' "$output_dir/$PREPARATION_ASSET")" = \
            "$CANDIDATE_ASSET_SHA256"
          test "$(jq -r '.candidate.archiveAsset' "$output_dir/$PREPARATION_ASSET")" = \
            "$CANDIDATE_ASSET"
          test "$(jq -r '.candidate.releaseTag' "$output_dir/$PREPARATION_ASSET")" = \
            "$CANDIDATE_RELEASE_TAG"
          test "$(jq -r '.repoSha' "$output_dir/$PREPARATION_ASSET")" = "$GITHUB_SHA"
          test "$(jq -r '.expected.releaseId' "$output_dir/$PREPARATION_ASSET")" = \
            "$EXPECTED_RELEASE"
          test "$(jq -r '.expected.candidateId' "$output_dir/$PREPARATION_ASSET")" = \
            "$EXPECTED_CANDIDATE"
          test "$(jq -r '.expected.generation' "$output_dir/$PREPARATION_ASSET")" = \
            "$EXPECTED_GENERATION"
          echo "candidate_root=$candidate_root" >> "$GITHUB_OUTPUT"
          echo "preparation=$output_dir/$PREPARATION_ASSET" >> "$GITHUB_OUTPUT"
          echo "state=$candidate_root/production-publication-state.json" >> "$GITHUB_OUTPUT"

      - name: Deploy authenticated release operator
        id: operator
        run: |
          set -euo pipefail
          execution_token="$(openssl rand -hex 32)"
          secrets_file=/tmp/serving-publication/operator-secrets.json
          jq -n --arg executionToken "$execution_token" \
            '{PLAN098_EXECUTION_TOKEN:$executionToken}' > "$secrets_file"
          bunx wrangler deploy \
            --config apps/web/wrangler.plan098-operator.example.jsonc \
            --secrets-file "$secrets_file"
          rm "$secrets_file"
          echo "::add-mask::$execution_token"
          echo "token=$execution_token" >> "$GITHUB_OUTPUT"

      - name: Classify semantic no-op or resumable publication
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          bun tools/pipeline-v2/scripts/run-serving-publication-production.ts \
            --action classify \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --preparation "${{ steps.candidate.outputs.preparation }}" \
            --preparation-sha256 "$PREPARATION_SHA256" \
            --state "${{ steps.candidate.outputs.state }}"

      - name: Apply only pending v2 migrations
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          bun tools/pipeline-v2/scripts/run-serving-publication-production.ts \
            --action migrate \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --preparation "${{ steps.candidate.outputs.preparation }}" \
            --preparation-sha256 "$PREPARATION_SHA256" \
            --state "${{ steps.candidate.outputs.state }}"

      - name: Upload only absent verified immutable objects
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          bun tools/pipeline-v2/scripts/run-serving-publication-production.ts \
            --action blobs \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --preparation "${{ steps.candidate.outputs.preparation }}" \
            --preparation-sha256 "$PREPARATION_SHA256" \
            --state "${{ steps.candidate.outputs.state }}"

      - name: Stage candidate-scoped D1 projection
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          bun tools/pipeline-v2/scripts/run-serving-publication-production.ts \
            --action d1 \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --preparation "${{ steps.candidate.outputs.preparation }}" \
            --preparation-sha256 "$PREPARATION_SHA256" \
            --state "${{ steps.candidate.outputs.state }}"

      - name: Verify the complete closed candidate
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          bun tools/pipeline-v2/scripts/run-serving-publication-production.ts \
            --action verify \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --preparation "${{ steps.candidate.outputs.preparation }}" \
            --preparation-sha256 "$PREPARATION_SHA256" \
            --state "${{ steps.candidate.outputs.state }}"

      - name: Activate last, smoke, and record completion
        id: finalize
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          set -o pipefail
          bun tools/pipeline-v2/scripts/run-serving-publication-production.ts \
            --action finalize \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --preparation "${{ steps.candidate.outputs.preparation }}" \
            --preparation-sha256 "$PREPARATION_SHA256" \
            --state "${{ steps.candidate.outputs.state }}" \
            2>&1 | tee "${{ steps.candidate.outputs.candidate_root }}/production-finalize.log"

      - name: Roll back pointer only after failed finalize
        if: always() && steps.finalize.outcome != 'skipped' && steps.finalize.outcome != 'success'
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          bun tools/pipeline-v2/scripts/run-serving-publication-production.ts \
            --action rollback \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --preparation "${{ steps.candidate.outputs.preparation }}" \
            --preparation-sha256 "$PREPARATION_SHA256" \
            --state "${{ steps.candidate.outputs.state }}"

      - name: Hash production evidence
        if: always() && steps.candidate.outcome == 'success'
        run: |
          set -euo pipefail
          candidate_root="${{ steps.candidate.outputs.candidate_root }}"
          find "$candidate_root" -maxdepth 1 -type f \
            \( -name 'production-*.json' -o -name 'production-*.log' \) \
            -print0 | sort -z | xargs -0 sha256sum > \
            "$candidate_root/production-publication.receipt.sha256"

      - name: Upload production evidence
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: serving-publication-${{ inputs.candidate_id }}-${{ github.run_id }}
          path: |
            ${{ steps.candidate.outputs.candidate_root }}/production-*.json
            ${{ steps.candidate.outputs.candidate_root }}/production-*.log
            ${{ steps.candidate.outputs.candidate_root }}/production-publication.receipt.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary release operator
        if: always() && steps.operator.outcome != 'skipped'
        run: |
          set -euo pipefail
          cleanup=/tmp/serving-publication/operator-delete.json
          curl --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$cleanup" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/bus-priority-plan098-operator"
          if ! jq -e '.success == true or ((.errors // []) | any(.code == 10090))' "$cleanup" > /dev/null; then
            jq -c '{success,errors:[.errors[]? | {code,message}]}' "$cleanup" >&2
            exit 1
          fi
