name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check knowledge/wiki contract
        run: bun run check:knowledge

      - name: Check types
        run: bun run check:types

      - name: Check architecture
        run: bun run check:architecture

      - name: Run tests
        run: bun run test

      - name: Verify web release
        run: bun run check:web-release

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://bus-priority-impact-studio.c20carroll.workers.dev/
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check deploy credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare deploy because CLOUDFLARE_API_TOKEN is not configured."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build web release
        if: steps.cloudflare.outputs.deploy == 'true'
        run: bun --filter @bp/web build

      - name: Deploy Worker
        if: steps.cloudflare.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun --filter @bp/web deploy
