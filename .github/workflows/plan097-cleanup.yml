name: Plan 097 temporary control cleanup

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 7aa7065a7e971d97435b3f22098d78b0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PLAN097_CLEANUP_ACCESS_API_TOKEN: ${{ secrets.PLAN097_CLEANUP_ACCESS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify completion and retire one-time controls
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PLAN097_CLEANUP_ACCESS_API_TOKEN"
          output_dir=/tmp/plan097-cleanup
          mkdir -p "$output_dir"

          release_id=pub_20260725T164123260Z
          completion_sha=c1758c865745c9eae47df3bc15c0e288ce69f6b988f4cb9e3e35e380ed1ff8af
          completion_bytes=17821
          completion_key="operations/plan097/completion/${release_id}/completion.${completion_sha}.json"
          bunx wrangler r2 object get \
            "bus-priority-plan097-production-operations/${completion_key}" \
            --remote \
            --file "$output_dir/completion.json"
          test "$(sha256sum "$output_dir/completion.json" | cut -d' ' -f1)" = "$completion_sha"
          test "$(wc -c < "$output_dir/completion.json")" = "$completion_bytes"
          jq -e \
            --arg releaseId "$release_id" \
            --arg proofSha d5929c591580c540366fe30caac9b9270ca5c3bae687c4d4e92762043174edd2 \
            '.artifactKind == "bp.ops.plan097.completion.v1"
             and .outcome == "active"
             and .candidateReleaseId == $releaseId
             and .proofSummary.sha256 == $proofSha
             and [.httpComparisons[].phase] == ["production-baseline", "production-active"]' \
            "$output_dir/completion.json"

          api_call() {
            local token="$1"
            local method="$2"
            local path="$3"
            API_RESPONSE_FILE="$(mktemp)"
            API_STATUS="$(
              curl --silent --show-error --retry 2 \
                --output "$API_RESPONSE_FILE" \
                --write-out '%{http_code}' \
                --request "$method" \
                --header "Authorization: Bearer $token" \
                --header "Content-Type: application/json" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$path"
            )"
          }

          require_success() {
            if [ "$API_STATUS" -lt 200 ] || [ "$API_STATUS" -ge 300 ]; then
              jq -n \
                --argjson status "$API_STATUS" \
                --slurpfile response "$API_RESPONSE_FILE" \
                '{status:$status,errors:[$response[0].errors[]? | {code,message}]}' >&2
              rm "$API_RESPONSE_FILE"
              exit 1
            fi
          }

          workers='[]'
          for worker in \
            bus-priority-plan097-preflight \
            bus-priority-plan097-proof \
            bus-priority-plan097-activation
          do
            set +e
            bunx wrangler deployments status \
              --name "$worker" \
              --json \
              > "$output_dir/$worker.pre.json" \
              2> "$output_dir/$worker.pre.log"
            pre_exit="$?"
            set -e
            if [ "$pre_exit" -eq 0 ]; then
              jq -e '.versions | length > 0' "$output_dir/$worker.pre.json" > /dev/null
              pre_status=present
              rm "$output_dir/$worker.pre.log"
              bunx wrangler delete "$worker" --force
              delete_status=deleted
            else
              grep -Eq 'does not exist|code: 10007' "$output_dir/$worker.pre.log"
              rm "$output_dir/$worker.pre.log"
              pre_status=absent
              delete_status=already_absent
            fi
            set +e
            bunx wrangler deployments status \
              --name "$worker" \
              --json \
              > "$output_dir/$worker.post.json" \
              2> "$output_dir/$worker.post.log"
            post_exit="$?"
            set -e
            test "$post_exit" -ne 0
            grep -Eq 'does not exist|code: 10007' "$output_dir/$worker.post.log"
            rm "$output_dir/$worker.post.log"
            post_status=absent
            workers="$(
              jq -c \
                --arg name "$worker" \
                --arg preStatus "$pre_status" \
                --arg deleteStatus "$delete_status" \
                --arg postStatus "$post_status" \
                '. + [{
                  name:$name,
                  preStatus:$preStatus,
                  deleteStatus:$deleteStatus,
                  postStatus:$postStatus
                }]' <<< "$workers"
            )"
          done

          apps='[]'
          app_rows=(
            "preflight|8b356267-b390-4731-b918-7e3933a495a7|c1daa8ce-34ed-41ea-924f-e41ac27d6f5d|bus-priority-plan097-preflight|bus-priority-plan097-preflight.c20carroll.workers.dev/__operations/plan097"
            "proof|0d393afc-15ad-484c-8353-50e8d05e2286|c66441f3-3c55-46a4-a184-49f0e64174b2|bus-priority-plan097-proof|bus-priority-plan097-proof.c20carroll.workers.dev/__operations/plan097"
            "activation|848e3df5-76a0-46f5-9d27-bfd752579fe3|118f057b-5e91-49e6-99c7-c56873a9b4f4|bus-priority-plan097-activation|bus-priority-plan097-activation.c20carroll.workers.dev/__operations/plan097"
          )
          for row in "${app_rows[@]}"; do
            IFS='|' read -r phase app_id policy_id app_name app_domain <<< "$row"
            api_call "$PLAN097_CLEANUP_ACCESS_API_TOKEN" GET "access/apps/$app_id"
            app_pre_status="$API_STATUS"
            if [ "$app_pre_status" = 200 ]; then
              jq -e \
                --arg appId "$app_id" \
                --arg appName "$app_name" \
                --arg appDomain "$app_domain" \
                '.success == true
                 and .result.id == $appId
                 and .result.name == $appName
                 and .result.domain == $appDomain' \
                "$API_RESPONSE_FILE" > /dev/null
              policy_present="$(
                jq -r \
                  --arg policyId "$policy_id" \
                  'any(.result.policies[]?; .id == $policyId)' \
                  "$API_RESPONSE_FILE"
              )"
              rm "$API_RESPONSE_FILE"
              if [ "$policy_present" = true ]; then
                api_call "$PLAN097_CLEANUP_ACCESS_API_TOKEN" DELETE \
                  "access/apps/$app_id/policies/$policy_id"
                policy_delete_status="$API_STATUS"
                require_success
                rm "$API_RESPONSE_FILE"
              else
                policy_delete_status=already_absent
              fi
              api_call "$PLAN097_CLEANUP_ACCESS_API_TOKEN" DELETE "access/apps/$app_id"
              app_delete_status="$API_STATUS"
              require_success
              rm "$API_RESPONSE_FILE"
            elif [ "$app_pre_status" = 404 ]; then
              policy_delete_status=already_absent
              app_delete_status=already_absent
              rm "$API_RESPONSE_FILE"
            else
              require_success
            fi
            api_call "$PLAN097_CLEANUP_ACCESS_API_TOKEN" GET "access/apps/$app_id"
            app_post_status="$API_STATUS"
            rm "$API_RESPONSE_FILE"
            test "$app_post_status" = 404
            apps="$(
              jq -c \
                --arg phase "$phase" \
                --arg appId "$app_id" \
                --arg policyId "$policy_id" \
                --arg preStatus "$app_pre_status" \
                --arg policyDeleteStatus "$policy_delete_status" \
                --arg appDeleteStatus "$app_delete_status" \
                --arg postStatus "$app_post_status" \
                '. + [{
                  phase:$phase,
                  appId:$appId,
                  policyId:$policyId,
                  preStatus:$preStatus,
                  policyDeleteStatus:$policyDeleteStatus,
                  appDeleteStatus:$appDeleteStatus,
                  postStatus:$postStatus
                }]' <<< "$apps"
            )"
          done

          service_token_id=9a57c852-0ec3-4d8e-95d3-01c08420f2af
          service_token_name=bus-priority-plan097-pub_20260725T164123260Z
          api_call "$PLAN097_CLEANUP_ACCESS_API_TOKEN" GET \
            "access/service_tokens/$service_token_id"
          token_pre_status="$API_STATUS"
          if [ "$token_pre_status" = 200 ]; then
            jq -e \
              --arg tokenId "$service_token_id" \
              --arg tokenName "$service_token_name" \
              '.success == true
               and .result.id == $tokenId
               and .result.name == $tokenName' \
              "$API_RESPONSE_FILE" > /dev/null
            rm "$API_RESPONSE_FILE"
            api_call "$PLAN097_CLEANUP_ACCESS_API_TOKEN" DELETE \
              "access/service_tokens/$service_token_id"
            token_delete_status="$API_STATUS"
            require_success
            rm "$API_RESPONSE_FILE"
          elif [ "$token_pre_status" = 404 ]; then
            token_delete_status=already_absent
            rm "$API_RESPONSE_FILE"
          else
            require_success
          fi
          api_call "$PLAN097_CLEANUP_ACCESS_API_TOKEN" GET \
            "access/service_tokens/$service_token_id"
          token_post_status="$API_STATUS"
          rm "$API_RESPONSE_FILE"
          test "$token_post_status" = 404

          jq -n \
            --arg artifactKind bp.ops.plan097.cleanup.v1 \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg releaseId "$release_id" \
            --arg completionKey "$completion_key" \
            --arg completionSha256 "$completion_sha" \
            --argjson completionBytes "$completion_bytes" \
            --argjson workers "$workers" \
            --argjson apps "$apps" \
            --arg serviceTokenId "$service_token_id" \
            --arg serviceTokenName "$service_token_name" \
            --arg tokenPreStatus "$token_pre_status" \
            --arg tokenDeleteStatus "$token_delete_status" \
            --arg tokenPostStatus "$token_post_status" \
            '{
              artifactKind:$artifactKind,
              schemaVersion:1,
              completedAt:$completedAt,
              releaseId:$releaseId,
              completion:{
                key:$completionKey,
                sha256:$completionSha256,
                bytes:$completionBytes
              },
              deletedWorkers:$workers,
              deletedAccessApplications:$apps,
              deletedServiceToken:{
                id:$serviceTokenId,
                name:$serviceTokenName,
                preStatus:$tokenPreStatus,
                deleteStatus:$tokenDeleteStatus,
                postStatus:$tokenPostStatus
              },
              retainedEvidence:{
                productionOperationsBucket:"bus-priority-plan097-production-operations",
                proofRuntimeBucket:"bus-priority-plan097-proof-runtime",
                preflightOperationsBucket:"bus-priority-plan097-preflight-operations"
              }
            }' > "$output_dir/receipt.json"
          jq . "$output_dir/receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: plan097-cleanup-${{ github.sha }}
          path: /tmp/plan097-cleanup/receipt.json
          if-no-files-found: error
          retention-days: 30
