name: Generation 17 catch-up publication

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish-generation-17-catchup to authorize the production mutation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: serving-production-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://bus-priority-impact-studio.c20carroll.workers.dev/
    env:
      CANDIDATE_ASSET: gen17-catchup-candidate-afa266944bc3.tar.zst
      CANDIDATE_ASSET_SHA256: 10fce240398c6683fd20dac025301063caf23b14801552ced8f0d8f599b1a3fc
      CANDIDATE_ID: afa266944bc3e85d13c0ffd3c9a012acd9e2d9f01d965942d7ebf3b805f82ccf
      CANDIDATE_RELEASE_TAG: gen17-catchup-candidate-afa266944bc3
      CLOUDFLARE_ACCOUNT_ID: 7aa7065a7e971d97435b3f22098d78b0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PLAN098_ENDPOINT: https://bus-priority-plan098-operator.c20carroll.workers.dev/__operations/plan098
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Confirm reviewed production operation
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = publish-generation-17-catchup
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download and verify immutable candidate
        id: candidate
        run: |
          set -euo pipefail
          output_dir=/tmp/gen17-catchup
          mkdir -p "$output_dir"
          gh release download "$CANDIDATE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$CANDIDATE_ASSET" \
            --dir "$output_dir"
          test "$(sha256sum "$output_dir/$CANDIDATE_ASSET" | cut -d' ' -f1)" = \
            "$CANDIDATE_ASSET_SHA256"
          tar --zstd -xf "$output_dir/$CANDIDATE_ASSET" -C "$output_dir"
          candidate_root="$output_dir/candidate-1266baf5"
          test "$(sha256sum "$candidate_root/candidate.manifest.json" | cut -d' ' -f1)" = \
            843892c29e371e287dde1e6e0b6ac46445304b1550e239115582f58a1862cd9e
          test "$(sha256sum "$candidate_root/candidate-seed.sql" | cut -d' ' -f1)" = \
            49ed41666ed7a69f4220c8adf3a659f29e330c9270227b74f564cf47cbf26250
          echo "candidate_root=$candidate_root" >> "$GITHUB_OUTPUT"

      - name: Deploy authenticated release operator
        id: operator
        run: |
          set -euo pipefail
          execution_token="$(openssl rand -hex 32)"
          secrets_file=/tmp/gen17-catchup/operator-secrets.json
          jq -n --arg executionToken "$execution_token" \
            '{PLAN098_EXECUTION_TOKEN:$executionToken}' > "$secrets_file"
          bunx wrangler deploy \
            --config apps/web/wrangler.plan098-operator.example.jsonc \
            --secrets-file "$secrets_file"
          rm "$secrets_file"
          echo "::add-mask::$execution_token"
          echo "token=$execution_token" >> "$GITHUB_OUTPUT"

      - name: Stage and verify immutable R2 objects
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          bun tools/pipeline-v2/scripts/stage-gen17-catchup-production.ts \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --output "${{ steps.candidate.outputs.candidate_root }}/production-staging.json"

      - name: Stage candidate-scoped D1 projection
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          candidate_root="${{ steps.candidate.outputs.candidate_root }}"
          if jq -e '.d1StageRequired == true' "$candidate_root/production-staging.json" > /dev/null; then
            bunx wrangler d1 execute bus-priority-serving \
              --remote \
              --config packages/db/wrangler.d1-v2.jsonc \
              --file "$candidate_root/candidate-seed.sql"
          else
            echo "Generation-17 candidate is already active; preserving its staged D1 projection."
          fi

      - name: Mark ready, CAS-activate, and smoke production
        id: finalize
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          set -o pipefail
          bun tools/pipeline-v2/scripts/finalize-gen17-catchup-production.ts \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --output "${{ steps.candidate.outputs.candidate_root }}/production-completion.json" \
            2>&1 | tee "${{ steps.candidate.outputs.candidate_root }}/finalize-production.log"

      - name: Roll back only after failed finalize
        if: always() && steps.finalize.outcome != 'skipped' && steps.finalize.outcome != 'success'
        env:
          PLAN098_TOKEN: ${{ steps.operator.outputs.token }}
        run: |
          set -euo pipefail
          bun tools/pipeline-v2/scripts/rollback-gen17-catchup-production.ts \
            --candidate-root "${{ steps.candidate.outputs.candidate_root }}" \
            --finalize-log "${{ steps.candidate.outputs.candidate_root }}/finalize-production.log" \
            --output "${{ steps.candidate.outputs.candidate_root }}/production-failure-rollback.json"

      - name: Hash and upload production receipts
        if: always() && steps.candidate.outcome == 'success'
        run: |
          set -euo pipefail
          candidate_root="${{ steps.candidate.outputs.candidate_root }}"
          find "$candidate_root" -maxdepth 1 -type f \
            \( -name 'production-*.json' -o -name '*production.log' \) \
            -print0 | sort -z | xargs -0 sha256sum > "$candidate_root/gen17-production.receipt.sha256"

      - name: Upload production evidence
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gen17-catchup-publication-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ steps.candidate.outputs.candidate_root }}/production-*.json
            ${{ steps.candidate.outputs.candidate_root }}/*production.log
            ${{ steps.candidate.outputs.candidate_root }}/gen17-production.receipt.sha256
            ${{ steps.candidate.outputs.candidate_root }}/stage-plan.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove temporary release operator
        if: always() && steps.operator.outcome != 'skipped'
        run: |
          set -euo pipefail
          cleanup=/tmp/gen17-catchup/operator-delete.json
          curl --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --output "$cleanup" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/bus-priority-plan098-operator"
          if ! jq -e '.success == true or ((.errors // []) | any(.code == 10090))' "$cleanup" > /dev/null; then
            jq -c '{success,errors:[.errors[]? | {code,message}]}' "$cleanup" >&2
            exit 1
          fi
