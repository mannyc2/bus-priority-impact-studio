name: Plan 097 production activation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://bus-priority-impact-studio.c20carroll.workers.dev/
    env:
      CLOUDFLARE_ACCOUNT_ID: 7aa7065a7e971d97435b3f22098d78b0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PLAN097_ACCESS_TEAM_DOMAIN: ${{ secrets.PLAN097_ACCESS_TEAM_DOMAIN }}
      PLAN097_ACTIVATION_ACCESS_AUD: ${{ secrets.PLAN097_ACTIVATION_ACCESS_AUD }}
      PLAN097_SERVICE_TOKEN_ID: ${{ secrets.PLAN097_SERVICE_TOKEN_ID }}
      PLAN097_SERVICE_TOKEN_SECRET: ${{ secrets.PLAN097_SERVICE_TOKEN_SECRET }}
      PLAN097_SIGNING_KEY_ID: ${{ secrets.PLAN097_SIGNING_KEY_ID }}
      PLAN097_SIGNING_PUBLIC_KEY_SPKI_BASE64: ${{ secrets.PLAN097_SIGNING_PUBLIC_KEY_SPKI_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render and deploy protected activation Worker
        run: |
          set -euo pipefail
          for required in \
            CLOUDFLARE_API_TOKEN \
            PLAN097_ACCESS_TEAM_DOMAIN \
            PLAN097_ACTIVATION_ACCESS_AUD \
            PLAN097_SERVICE_TOKEN_ID \
            PLAN097_SERVICE_TOKEN_SECRET \
            PLAN097_SIGNING_KEY_ID \
            PLAN097_SIGNING_PUBLIC_KEY_SPKI_BASE64
          do
            test -n "${!required}"
          done
          output_dir=/tmp/plan097-activation
          candidate_dir="$output_dir/candidate"
          mkdir -p "$candidate_dir"
          openssl rand -hex 32 > "$output_dir/execution-token"
          chmod 600 "$output_dir/execution-token"
          PLAN097_PRODUCTION_EXECUTION_TOKEN="$(cat "$output_dir/execution-token")"
          config=apps/web/wrangler.plan097-activation.jsonc
          jq \
            --arg accountId "$CLOUDFLARE_ACCOUNT_ID" \
            --arg teamDomain "$PLAN097_ACCESS_TEAM_DOMAIN" \
            --arg aud "$PLAN097_ACTIVATION_ACCESS_AUD" \
            --arg serviceTokenId "$PLAN097_SERVICE_TOKEN_ID" \
            --arg operationId "plan097:pub_20260725T164123260Z" \
            --arg activationSha "7f570d37839b382f0b00488ed8c7f6d03dcb80dd5a933c19c85f3d40dd17327c" \
            --arg restoreSha "01696521dee0deaf0a0d29e985d9e89b46189bb602a0d8d40a1d358101df1d28" \
            --arg preflightSha "fe5dea4a775e5220c73fb1d18322ea4eb4ade11de906b17e4fcffe2131769191" \
            --arg repoSha "$GITHUB_SHA" \
            --arg productionD1Id "d9cd87e2-1f77-44eb-b712-e834b23497b0" \
            '
              .account_id = $accountId
              | .vars.PLAN097_ACCESS_TEAM_DOMAIN = $teamDomain
              | .vars.PLAN097_ACCESS_AUD = $aud
              | .vars.PLAN097_ACCESS_SERVICE_TOKEN_ID = $serviceTokenId
              | .vars.PLAN097_OPERATION_ID = $operationId
              | .vars.PLAN097_ACTIVATION_BUNDLE_SHA256 = $activationSha
              | .vars.PLAN097_RESTORE_BUNDLE_SHA256 = $restoreSha
              | .vars.PLAN097_PREFLIGHT_RECEIPT_SHA256 = $preflightSha
              | .vars.PLAN097_REPO_SHA = $repoSha
              | .vars.PLAN097_D1_DATABASE_ID = $productionD1Id
              | .d1_databases[0].database_id = $productionD1Id
            ' apps/web/wrangler.plan097-activation.example.jsonc > "$config"
          if grep -q '<[^>]*>' "$config"; then
            echo "Rendered activation config retains a placeholder" >&2
            exit 1
          fi

          jq -n \
            --arg keyId "$PLAN097_SIGNING_KEY_ID" \
            --arg publicKey "$PLAN097_SIGNING_PUBLIC_KEY_SPKI_BASE64" \
            --arg executionToken "$PLAN097_PRODUCTION_EXECUTION_TOKEN" \
            '{
              PLAN097_PREFLIGHT_SIGNING_KEY_ID:$keyId,
              PLAN097_PREFLIGHT_SIGNING_PUBLIC_KEY_SPKI_BASE64:$publicKey,
              PLAN097_EXECUTION_TOKEN:$executionToken
            }' > "$output_dir/secrets.json"
          bunx wrangler deploy \
            --config "$config" \
            --secrets-file "$output_dir/secrets.json"
          bunx wrangler secret bulk \
            "$output_dir/secrets.json" \
            --config "$config"
          rm "$output_dir/secrets.json"

          endpoint="https://bus-priority-plan097-activation.c20carroll.workers.dev/__operations/plan097"
          for attempt in $(seq 1 30); do
            anonymous_status="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --request POST \
                --header "Content-Type: application/json" \
                --data '{}' \
                "$endpoint"
            )"
            wrong_secret_status="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --request POST \
                --header "Content-Type: application/json" \
                --header "CF-Access-Client-Id: $PLAN097_SERVICE_TOKEN_ID" \
                --header "CF-Access-Client-Secret: plan097-intentionally-wrong" \
                --data '{}' \
                "$endpoint"
            )"
            authenticated_status="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --request POST \
                --header "Content-Type: application/json" \
                --header "CF-Access-Client-Id: $PLAN097_SERVICE_TOKEN_ID" \
                --header "CF-Access-Client-Secret: $PLAN097_SERVICE_TOKEN_SECRET" \
                --data '{}' \
                "$endpoint"
            )"
            if { [ "$anonymous_status" = 401 ] || [ "$anonymous_status" = 403 ]; } &&
              { [ "$wrong_secret_status" = 401 ] || [ "$wrong_secret_status" = 403 ]; } &&
              [ "$authenticated_status" = 409 ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Access convergence failed: anonymous=$anonymous_status wrong-secret=$wrong_secret_status authenticated=$authenticated_status" >&2
              exit 1
            fi
            sleep 2
          done

          execution_status=000
          for attempt in $(seq 1 30); do
            execution_status="$(
              curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --request POST \
                --header "Content-Type: application/json" \
                --header "CF-Access-Client-Id: $PLAN097_SERVICE_TOKEN_ID" \
                --header "CF-Access-Client-Secret: $PLAN097_SERVICE_TOKEN_SECRET" \
                --header "X-Plan097-Execution-Token: $PLAN097_PRODUCTION_EXECUTION_TOKEN" \
                --data '{
                  "operationId":"plan097:pub_20260725T164123260Z",
                  "activationBundleSha256":"7f570d37839b382f0b00488ed8c7f6d03dcb80dd5a933c19c85f3d40dd17327c",
                  "action":"mirror-bundle"
                }' \
                "$endpoint"
            )"
            if [ "$execution_status" = 200 ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Execution-token convergence failed with HTTP $execution_status" >&2
              exit 1
            fi
            sleep 2
          done

          printf '%s\n' "$anonymous_status" > "$output_dir/access-anonymous-status"
          printf '%s\n' "$wrong_secret_status" > "$output_dir/access-wrong-secret-status"
          printf '%s\n' "$authenticated_status" > "$output_dir/access-authenticated-status"
          printf '%s\n' "$execution_status" > "$output_dir/execution-status"

      - name: Retrieve and verify immutable activation inputs
        run: |
          set -euo pipefail
          output_dir=/tmp/plan097-activation
          candidate_dir="$output_dir/candidate"
          release_id=pub_20260725T164123260Z
          activation_sha=7f570d37839b382f0b00488ed8c7f6d03dcb80dd5a933c19c85f3d40dd17327c
          preflight_sha=fe5dea4a775e5220c73fb1d18322ea4eb4ade11de906b17e4fcffe2131769191
          restore_sha=01696521dee0deaf0a0d29e985d9e89b46189bb602a0d8d40a1d358101df1d28
          bunx wrangler r2 object get \
            "bus-priority-plan097-preflight-operations/operations/plan097/bundles/${release_id}/activation.${activation_sha}.json" \
            --remote \
            --file "$candidate_dir/plan097-activation-bundle.json"
          bunx wrangler r2 object get \
            "bus-priority-plan097-preflight-operations/operations/plan097/releases/${release_id}/artifact-manifest.json" \
            --remote \
            --file "$candidate_dir/plan097-artifact-manifest.json"
          bunx wrangler r2 object get \
            "bus-priority-plan097-preflight-operations/operations/plan097/preflight/${release_id}/preflight.${preflight_sha}.json" \
            --remote \
            --file "$output_dir/preflight.json"
          bunx wrangler r2 object get \
            "bus-priority-plan097-preflight-operations/operations/plan097/bundles/${release_id}/restore.${restore_sha}.json" \
            --remote \
            --file "$candidate_dir/plan097-restore-bundle.json"

          test "$(sha256sum "$candidate_dir/plan097-activation-bundle.json" | cut -d' ' -f1)" = "$activation_sha"
          test "$(sha256sum "$output_dir/preflight.json" | cut -d' ' -f1)" = "$preflight_sha"
          test "$(sha256sum "$candidate_dir/plan097-restore-bundle.json" | cut -d' ' -f1)" = "$restore_sha"
          manifest_sha="$(jq -er '.artifactManifest.sha256' "$candidate_dir/plan097-activation-bundle.json")"
          manifest_bytes="$(jq -er '.artifactManifest.byteLength' "$candidate_dir/plan097-activation-bundle.json")"
          test "$(sha256sum "$candidate_dir/plan097-artifact-manifest.json" | cut -d' ' -f1)" = "$manifest_sha"
          test "$(wc -c < "$candidate_dir/plan097-artifact-manifest.json")" = "$manifest_bytes"
          jq -e \
            --arg releaseId "$release_id" \
            --arg activationSha "$activation_sha" \
            --arg restoreSha "$restore_sha" \
            '.outcome == "ready"
             and .candidate.releaseId == $releaseId
             and .candidate.activationBundleSha256 == $activationSha
             and .rollbackPackage.sha256 == $restoreSha
             and .schemaReconciliation.mapReleaseCatalogState == "absent"
             and .schemaReconciliation.applyRecoverySql == true' \
            "$output_dir/preflight.json"
          jq '.httpBaseline' "$output_dir/preflight.json" > "$output_dir/http-baseline.json"

      - name: Activate candidate from proven artifacts
        env:
          PLAN097_RECOVERY_ENDPOINT: https://bus-priority-plan097-activation.c20carroll.workers.dev/__operations/plan097
          PLAN097_PUBLIC_BASE_URL: https://bus-priority-impact-studio.c20carroll.workers.dev/
          PLAN097_CANDIDATE_DIR: /tmp/plan097-activation/candidate
          PLAN097_ARTIFACT_ROOT: /tmp/plan097-activation/not-used
          PLAN097_RESTORE_BUNDLE_PATH: /tmp/plan097-activation/candidate/plan097-restore-bundle.json
          PLAN097_RESTORE_BUNDLE_SHA256: 01696521dee0deaf0a0d29e985d9e89b46189bb602a0d8d40a1d358101df1d28
          PLAN097_HTTP_BASELINE_PATH: /tmp/plan097-activation/http-baseline.json
          PLAN097_PREFLIGHT_RECEIPT_SHA256: fe5dea4a775e5220c73fb1d18322ea4eb4ade11de906b17e4fcffe2131769191
          PLAN097_SERVICE_TOKEN_ID: ${{ secrets.PLAN097_SERVICE_TOKEN_ID }}
          PLAN097_SERVICE_TOKEN_SECRET: ${{ secrets.PLAN097_SERVICE_TOKEN_SECRET }}
          PLAN097_MIRROR_PROOF_ARTIFACTS: "true"
          PLAN097_PROOF_SUMMARY_KEY: operations/plan097/proof/pub_20260725T164123260Z/proof-summary.6c6e12f2346131b016fb6ccb2242b369aa07550644f82e7c7e91c5184a25b6c6.json
          PLAN097_PROOF_SUMMARY_SHA256: 6c6e12f2346131b016fb6ccb2242b369aa07550644f82e7c7e91c5184a25b6c6
          PLAN097_PROOF_SUMMARY_BYTES: "30446"
        run: |
          set -euo pipefail
          export PLAN097_EXECUTION_TOKEN
          PLAN097_EXECUTION_TOKEN="$(cat /tmp/plan097-activation/execution-token)"
          config=apps/web/wrangler.plan097-activation.jsonc
          tail_raw=/tmp/plan097-activation/worker-tail.raw.jsonl
          tail_sanitized=/tmp/plan097-activation/worker-tail.jsonl
          bunx wrangler tail \
            --config "$config" \
            --format json \
            > "$tail_raw" \
            2> /tmp/plan097-activation/worker-tail-status.log &
          tail_pid=$!
          cleanup_tail() {
            kill "$tail_pid" 2>/dev/null || true
            wait "$tail_pid" 2>/dev/null || true
            if [ -s "$tail_raw" ]; then
              jq -c \
                '{
                  outcome,
                  exceptions,
                  logs,
                  event:{
                    request:{
                      method:.event.request.method,
                      url:.event.request.url
                    }
                  }
                }' \
                "$tail_raw" > "$tail_sanitized" || true
            else
              : > "$tail_sanitized"
            fi
            rm -f "$tail_raw" /tmp/plan097-activation/worker-tail-status.log
          }
          trap cleanup_tail EXIT
          sleep 3
          set +e
          bun tools/pipeline-v2/src/cli.ts \
            publish recovery \
            --action activate \
            --operation plan097:pub_20260725T164123260Z \
            --receipt-sha256 fe5dea4a775e5220c73fb1d18322ea4eb4ade11de906b17e4fcffe2131769191 \
            --json \
            --full-output \
            > /tmp/plan097-activation/result.json \
            2> /tmp/plan097-activation/cli.log
          activation_status=$?
          set -e
          sleep 3
          cleanup_tail
          trap - EXIT
          if [ "$activation_status" -ne 0 ]; then
            sed -n '1,160p' /tmp/plan097-activation/cli.log >&2
            exit "$activation_status"
          fi
          jq -e \
            '.outcome == "pass"
             and .operationId == "plan097:pub_20260725T164123260Z"
             and .completion.kind == "completion"
             and [.httpComparisons[].phase] == ["production-baseline", "production-active"]
             and .httpComparisons[1].baseline.activeReleaseId == "pub_20260725T164123260Z"' \
            /tmp/plan097-activation/result.json

      - name: Persist sanitized activation receipt
        if: always()
        run: |
          set -euo pipefail
          output_dir=/tmp/plan097-activation
          config=apps/web/wrangler.plan097-activation.jsonc
          bunx wrangler deployments status \
            --json \
            --config "$config" |
            jq '{
              id,
              created_on,
              versions:[.versions[] | {version_id,percentage}]
            }' > "$output_dir/deployment.json"
          result_sha256=null
          completion=null
          outcome=workflow_failed
          if jq -e . "$output_dir/result.json" > /dev/null 2>&1; then
            result_sha256="$(sha256sum "$output_dir/result.json" | cut -d' ' -f1)"
            completion="$(jq -c '.completion' "$output_dir/result.json")"
            outcome="$(jq -r '.outcome' "$output_dir/result.json")"
          fi
          jq -n \
            --arg artifactKind "bp.ops.plan097.activation-deploy.v1" \
            --arg repoSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg operationId "plan097:pub_20260725T164123260Z" \
            --arg outcome "$outcome" \
            --arg resultSha256 "$result_sha256" \
            --argjson anonymousStatus "$(cat "$output_dir/access-anonymous-status")" \
            --argjson wrongSecretStatus "$(cat "$output_dir/access-wrong-secret-status")" \
            --argjson authenticatedStatus "$(cat "$output_dir/access-authenticated-status")" \
            --argjson executionStatus "$(cat "$output_dir/execution-status")" \
            --argjson completion "$completion" \
            --slurpfile deployment "$output_dir/deployment.json" \
            '{
              artifactKind:$artifactKind,
              schemaVersion:1,
              repoSha:$repoSha,
              workflowRunId:$workflowRunId,
              operationId:$operationId,
              outcome:$outcome,
              activationResultSha256:$resultSha256,
              completion:$completion,
              accessChecks:{
                anonymousStatus:$anonymousStatus,
                wrongSecretStatus:$wrongSecretStatus,
                authenticatedStatus:$authenticatedStatus,
                executionStatus:$executionStatus
              },
              deployment:$deployment[0]
            }' > "$output_dir/receipt.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plan097-production-activation-${{ github.sha }}
          path: |
            /tmp/plan097-activation/receipt.json
            /tmp/plan097-activation/result.json
            /tmp/plan097-activation/cli.log
            /tmp/plan097-activation/worker-tail.jsonl
          if-no-files-found: error
          retention-days: 90

      - name: Remove ephemeral execution token
        if: always()
        run: rm -f /tmp/plan097-activation/execution-token
