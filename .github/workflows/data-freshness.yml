name: Data freshness alarm

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: data-freshness-alarm
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      FRESHNESS_ROOT: /tmp/bp-freshness-alarm
      FRESHNESS_MARKER: "<!-- bp-data-freshness-alarm:v1 -->"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build advisory freshness report
        run: |
          set -euo pipefail
          mkdir -p "$FRESHNESS_ROOT"
          bun --filter @bp/pipeline-v2 cli -- audit freshness-alarm \
            --artifact-root "$FRESHNESS_ROOT/artifacts" \
            --output "$FRESHNESS_ROOT/report.json" \
            --issue-body "$FRESHNESS_ROOT/issue.md"
          jq -e \
            '.artifactKind == "bp.ops.freshness-alarm.v1"
             and .schemaVersion == 1
             and .advisory == true
             and (.status == "healthy" or .status == "attention")
             and .issueMarker == "<!-- bp-data-freshness-alarm:v1 -->"' \
            "$FRESHNESS_ROOT/report.json"
          sha256sum "$FRESHNESS_ROOT/report.json" "$FRESHNESS_ROOT/issue.md" \
            > "$FRESHNESS_ROOT/receipt.sha256"

      - name: Reconcile the one bot-owned freshness issue
        run: |
          set -euo pipefail
          pages="$FRESHNESS_ROOT/issues-pages.json"
          matches="$FRESHNESS_ROOT/issues-matches.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" > "$pages"
          jq -s --arg marker "$FRESHNESS_MARKER" \
            '[.[][] | select(.pull_request == null)
              | select(.user.login == "github-actions[bot]")
              | select((.body // "") | contains($marker))]' \
            "$pages" > "$matches"
          count="$(jq 'length' "$matches")"
          if [[ "$count" -gt 1 ]]; then
            echo "More than one bot-owned freshness issue carries the stable marker." >&2
            exit 1
          fi
          status="$(jq -r '.status' "$FRESHNESS_ROOT/report.json")"
          if [[ "$status" == "attention" ]]; then
            if [[ "$count" -eq 0 ]]; then
              gh issue create \
                --title "Data freshness needs attention" \
                --body-file "$FRESHNESS_ROOT/issue.md"
            else
              number="$(jq -r '.[0].number' "$matches")"
              state="$(jq -r '.[0].state' "$matches")"
              if [[ "$state" == "closed" ]]; then
                gh issue reopen "$number"
              fi
              gh issue edit "$number" \
                --title "Data freshness needs attention" \
                --body-file "$FRESHNESS_ROOT/issue.md"
            fi
          elif [[ "$count" -eq 1 ]] && [[ "$(jq -r '.[0].state' "$matches")" == "open" ]]; then
            number="$(jq -r '.[0].number' "$matches")"
            gh issue close "$number" \
              --comment "The scheduled advisory freshness report is healthy."
          fi

      - name: Upload freshness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-freshness-${{ github.run_id }}
          path: /tmp/bp-freshness-alarm/
          if-no-files-found: error
          retention-days: 30
